<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Yuzu 英語ステップ</title>
<style>
:root{--teal:#75c8c8;--deep:#237f82;--cream:#fffdf5;--yellow:#ffe89a;--coral:#e85b4f;--green:#43a66f;--ink:#294243;--purple:#8170c7;--blue:#4c98c5;--orange:#df9f38}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(#e9f8f7,#fff9ea);color:var(--ink);min-height:100vh}header{background:#bce6e3;border-bottom:5px solid var(--teal);padding:16px 12px;text-align:center;position:sticky;top:0;z-index:20}header h1{margin:0;color:#bd443a;font-size:1.35rem}header p{margin:4px 0 0;font-size:.78rem;color:#477575}#app{max-width:680px;margin:auto;padding:14px}.card{background:var(--cream);border:2px solid #eee6c9;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 5px 0 rgba(0,0,0,.07)}h2{font-size:1.08rem;color:#bd443a;border-left:6px solid var(--coral);padding-left:9px;margin:0 0 14px}.menu{display:grid;grid-template-columns:1fr 1fr;gap:11px}.menu button,.btn{border:0;border-radius:16px;padding:16px 10px;color:white;font:inherit;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.14);cursor:pointer}.menu button:active,.btn:active{transform:translateY(2px);box-shadow:none}.menu .wide{grid-column:1/-1}.pink{background:#d95d82}.purple{background:var(--purple)}.teal{background:var(--deep)}.blue{background:var(--blue)}.orange{background:var(--orange)}.green{background:#568d5a}.back{border:2px solid var(--teal);background:white;color:var(--deep);border-radius:20px;padding:7px 14px;font-weight:800;margin-bottom:12px}.progress{height:12px;background:#e8e8e8;border-radius:10px;overflow:hidden}.progress div{height:100%;background:var(--green);transition:width .25s}.progress-label{display:flex;justify-content:space-between;font-size:.8rem;font-weight:800;margin:6px 0 12px;color:#527071}.tag{display:inline-block;background:var(--yellow);color:#a94438;border-radius:15px;padding:4px 10px;font-size:.78rem;font-weight:800}.q{text-align:center;font-size:1.45rem;font-weight:900;margin:18px 0 7px;line-height:1.55}.sub{text-align:center;font-size:.82rem;color:#777;margin-bottom:16px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{background:white;border:2px solid var(--teal);border-radius:15px;padding:16px 8px;font-size:1.08rem;font-weight:900;color:var(--ink)}.choice.correct{background:#dff7e7;border-color:var(--green);color:#267348}.choice.wrong{background:#fde1de;border-color:var(--coral);color:#a7352d}.choice.lock{pointer-events:none}.feedback{text-align:center;font-weight:800;min-height:28px;margin-top:13px;line-height:1.55}.ok{color:#267348}.no{color:#b73f35}.next{display:none;width:100%;margin-top:12px;background:var(--deep);font-size:1rem}.next.show{display:block}.note{background:#fff1b9;border-radius:12px;padding:10px;text-align:center;font-size:.9rem;margin-top:12px;font-weight:700;line-height:1.5}.score{text-align:center;font-size:2.5rem;font-weight:900;color:#bd443a;margin:12px}.row{display:flex;gap:10px;margin-top:12px}.row .btn{flex:1}.level-record{margin-top:9px;padding:10px;border-radius:12px;background:white}.level-record b{color:var(--deep)}table{width:100%;border-collapse:collapse;font-size:.75rem;background:white}th,td{border:1px solid #e7dca7;padding:6px;text-align:center}th{background:var(--yellow)}td:first-child{background:#d9f0ed;font-weight:700}.blank{width:100%;min-width:52px;background:#fff;border:2px dashed var(--teal);border-radius:8px;padding:7px 4px;font-weight:900;color:var(--deep)}.blank.active{outline:3px solid var(--coral)}.blank.ok{background:#dff7e7;border-style:solid;border-color:var(--green)}.blank.ng{background:#fde1de;border-style:solid;border-color:var(--coral)}.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.word{border:2px solid var(--deep);background:white;color:var(--deep);border-radius:20px;padding:8px 13px;font-weight:900}.word.used{opacity:.3}.answerline{font-size:.78rem;color:#b73f35;margin-top:3px;font-weight:800}.recordbox{background:#eef9f7;border-radius:12px;padding:10px 12px;margin-bottom:12px;text-align:center;font-weight:800}.newbest{background:#fff0b8;border:3px solid #f1b83b;border-radius:16px;padding:14px;text-align:center;font-size:1.05rem;font-weight:900;color:#9a5c00;margin-top:12px}.timer-sticky{position:sticky;top:82px;z-index:15;background:#fff;border:4px solid var(--deep);border-radius:18px;padding:10px 14px;margin:0 0 14px;box-shadow:0 6px 14px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:space-between}.timer-sticky .label{font-weight:900;font-size:.9rem}.timer-sticky .time{font-size:2rem;font-weight:900;color:var(--deep);font-variant-numeric:tabular-nums;min-width:110px;text-align:right}.timer-sticky.warn{border-color:var(--coral);background:#fff2ef}.timer-sticky.warn .time{color:var(--coral)}.start-card{text-align:center;padding:26px 18px}.start-icon{font-size:3.2rem;margin-bottom:8px}.start-title{font-size:1.35rem;font-weight:900;color:var(--deep);margin:8px 0}.start-desc{font-size:.92rem;line-height:1.7;color:#587071;margin:8px 0 20px}.start-btn{width:100%;border:0;border-radius:22px;padding:18px;background:var(--coral);color:white;font:inherit;font-size:1.25rem;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.16);cursor:pointer}.start-btn:active{transform:translateY(3px);box-shadow:none}
</style></head>
<body><header><h1>🌱 Yuzu 英語ステップ</h1><p>正解を積み上げて、レベルアップ！</p></header><div id="app"></div>
<script>
const app=document.getElementById('app');
let state={screen:'home'};
const STORE='yuzuEnglishStep_v3';
function loadData(){try{return JSON.parse(localStorage.getItem(STORE))||{}}catch(e){return {}}}
let saved=loadData();if(!saved.levels)saved.levels={};if(!saved.table)saved.table={bestScore:0,bestTime:null,plays:0};
function save(){localStorage.setItem(STORE,JSON.stringify(saved))}
function shuf(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){app.innerHTML='';screens[state.screen]();scrollTo(0,0)}
const screens={};
const pronounQ=[
{q:'___ am Yuzu.',jp:'私はゆずです。',a:'I',c:['I','My','Me','Mine']},{q:'This is ___ book.',jp:'これは私の本です。',a:'my',c:['I','my','me','mine']},{q:'She likes ___.',jp:'彼女は私のことが好きです。',a:'me',c:['I','my','me','mine']},{q:'This book is ___.',jp:'この本は私のものです。',a:'mine',c:['I','my','me','mine']},{q:'___ is my brother.',jp:'彼は私の兄です。',a:'He',c:['He','His','Him','They']},{q:'This is ___ bag.',jp:'これは彼女のかばんです。',a:'her',c:['she','her','hers','him']},{q:'I know ___.',jp:'私は彼を知っています。',a:'him',c:['he','his','him','her']},{q:'___ are my friends.',jp:'彼らは私の友だちです。',a:'They',c:['They','Their','Them','We']},{q:'This is ___ house.',jp:'これは私たちの家です。',a:'our',c:['we','our','us','ours']},{q:'She helps ___.',jp:'彼女は私たちを助けます。',a:'us',c:['we','our','us','ours']}];
const beQ=[{q:'I ___ a student.',jp:'私は生徒です。',a:'am',c:['am','are','is','be']},{q:'You ___ kind.',jp:'あなたは親切です。',a:'are',c:['am','are','is','be']},{q:'He ___ busy.',jp:'彼は忙しいです。',a:'is',c:['am','are','is','be']},{q:'She ___ happy.',jp:'彼女は幸せです。',a:'is',c:['am','are','is','be']},{q:'We ___ friends.',jp:'私たちは友だちです。',a:'are',c:['am','are','is','be']},{q:'They ___ here.',jp:'彼らはここにいます。',a:'are',c:['am','are','is','be']},{q:'Taro ___ a boy.',jp:'タロウは男の子です。',a:'is',c:['am','are','is','be']},{q:'These books ___ new.',jp:'これらの本は新しいです。',a:'are',c:['am','are','is','be']}];
const verbQ=[{q:'I ___ soccer.',jp:'私はサッカーをします。',a:'play',c:['play','plays','am','do']},{q:'We ___ English.',jp:'私たちは英語を勉強します。',a:'study',c:['study','studies','are','studying']},{q:'They ___ dogs.',jp:'彼らは犬が好きです。',a:'like',c:['like','likes','is','liked']},{q:'You ___ TV.',jp:'あなたはテレビを見ます。',a:'watch',c:['watch','watches','are','see']},{q:'I ___ breakfast.',jp:'私は朝ごはんを食べます。',a:'eat',c:['eat','eats','am','ate']},{q:'We ___ to school.',jp:'私たちは学校へ行きます。',a:'go',c:['go','goes','are','went']},{q:'They ___ books.',jp:'彼らは本を読みます。',a:'read',c:['read','reads','are','reading']},{q:'You ___ music.',jp:'あなたは音楽を聞きます。',a:'listen to',c:['listen to','listens to','are','hear']}];
const questionQ=[{q:'___ you a student?',jp:'あなたは生徒ですか？',a:'Are',c:['Are','Is','Do','Does'],ans:'Yes, I am.'},{q:'___ he busy?',jp:'彼は忙しいですか？',a:'Is',c:['Are','Is','Do','Does'],ans:'Yes, he is.'},{q:'___ you like soccer?',jp:'あなたはサッカーが好きですか？',a:'Do',c:['Are','Is','Do','Does'],ans:'Yes, I do.'},{q:'___ she play tennis?',jp:'彼女はテニスをしますか？',a:'Does',c:['Are','Is','Do','Does'],ans:'Yes, she does.'},{q:'Are they friends?',jp:'彼らは友だちですか？',a:'Yes, they are.',c:['Yes, they are.','Yes, they do.','Yes, they is.','Yes, they does.'],ans:'Yes, they are.'},{q:'Do you study English?',jp:'あなたは英語を勉強しますか？',a:'Yes, I do.',c:['Yes, I do.','Yes, I am.','Yes, I does.','Yes, I is.'],ans:'Yes, I do.'},{q:'Does he like dogs?',jp:'彼は犬が好きですか？',a:'Yes, he does.',c:['Yes, he does.','Yes, he is.','Yes, he do.','Yes, he are.'],ans:'Yes, he does.'}];
const sQ=[{q:'He ___ soccer.',jp:'彼はサッカーをします。',a:'plays',c:['play','plays','playes','playing'],note:'he なので play → plays'},{q:'She ___ English.',jp:'彼女は英語を勉強します。',a:'studies',c:['study','studys','studies','studying'],note:'study → studies'},{q:'Taro ___ TV.',jp:'タロウはテレビを見ます。',a:'watches',c:['watch','watchs','watches','watchies'],note:'watch → watches'},{q:'He ___ to school.',jp:'彼は学校へ行きます。',a:'goes',c:['go','gos','goes','going'],note:'go → goes'},{q:'She ___ lunch.',jp:'彼女は昼ごはんを食べます。',a:'eats',c:['eat','eats','eates','eating'],note:'eat → eats'},{q:'My mother ___ books.',jp:'母は本を読みます。',a:'reads',c:['read','reads','reades','reading'],note:'1人なので read → reads'},{q:'Ken ___ music.',jp:'ケンは音楽を聞きます。',a:'listens to',c:['listen to','listens to','listen tos','listening'],note:'Ken = he と考える'}];
const levelMap={1:pronounQ,2:beQ,3:verbQ,4:questionQ,5:sQ};
function rec(n){return saved.levels[n]||{best:0}}
function progressHTML(score,total,label='正解した数'){const pct=total?score/total*100:0;return `<div class="progress"><div style="width:${pct}%"></div></div><div class="progress-label"><span>${label}</span><span>${score} / ${total}</span></div>`}
function stopTimer(){if(tableState.timerId){clearInterval(tableState.timerId);tableState.timerId=null}}
function home(){stopTimer();state={screen:'home'};render()}
function startLevel(n){stopTimer();state={screen:'quiz',level:n,list:shuf(levelMap[n]),i:0,score:0,answered:false};render()}
screens.home=()=>{app.innerHTML=`<div class="card"><h2>レベルをえらぼう</h2><div class="menu"><button class="pink" data-l="1">1️⃣<br>レベル1<br>代名詞の文章穴埋め</button><button class="purple" data-l="2">2️⃣<br>レベル2<br>be動詞</button><button class="orange" data-l="3">3️⃣<br>レベル3<br>一般動詞</button><button class="blue" data-l="4">4️⃣<br>レベル4<br>疑問文と答え</button><button class="teal wide" data-l="5">5️⃣<br>レベル5<br>動詞に s をつける</button><button class="green wide" id="tableBtn">⏱️📋<br>代名詞 早見表・タイムアタック</button></div></div><div class="card"><h2>これまでの進みぐあい</h2>${[1,2,3,4,5].map(n=>`<div class="level-record"><b>レベル${n}</b>${progressHTML(rec(n).best,levelMap[n].length,'最高正解数')}</div>`).join('')}<div class="recordbox" style="margin-top:12px">🏆 早見表ベスト：${saved.table.bestScore||0}問正解${saved.table.bestTime!=null?' ／ '+saved.table.bestTime.toFixed(1)+'秒':''}</div></div>`;app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>startLevel(Number(b.dataset.l)));document.getElementById('tableBtn').onclick=()=>{buildTable();state={screen:'table'};render()}};
screens.quiz=()=>{const s=state,x=s.list[s.i],choices=shuf(x.c);app.innerHTML=`<button class="back" id="back">← もどる</button><div class="card">${progressHTML(s.score,s.list.length)}<div style="text-align:center"><span class="tag">レベル${s.level}　問題 ${s.i+1}/${s.list.length}</span></div><div class="q">${x.q}</div><div class="sub">${x.jp}</div><div class="choices">${choices.map(c=>`<button class="choice" data-v="${c}">${c}</button>`).join('')}</div><div class="feedback" id="fb"></div><div id="extra"></div><button class="btn next" id="nextQ">次の問題 →</button></div>`;document.getElementById('back').onclick=home;document.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{if(s.answered)return;s.answered=true;const ok=btn.dataset.v===x.a;if(ok)s.score++;document.querySelectorAll('.choice').forEach(b=>{b.classList.add('lock');if(b.dataset.v===x.a)b.classList.add('correct');if(b===btn&&!ok)b.classList.add('wrong')});const p=app.querySelector('.progress div'),pl=app.querySelector('.progress-label span:last-child');if(p)p.style.width=(s.score/s.list.length*100)+'%';if(pl)pl.textContent=`${s.score} / ${s.list.length}`;const fb=document.getElementById('fb'),extra=document.getElementById('extra');fb.className='feedback '+(ok?'ok':'no');fb.innerHTML=ok?`せいかい！ 🎉<br><b>${x.q.replace('___',x.a)}</b>`:`正解は <b>「${x.a}」</b><br>${x.q.replace('___',x.a)}`;if(x.ans||x.note)extra.innerHTML=`<div class="note">${x.ans?'答え方：'+x.ans:x.note}</div>`;document.getElementById('nextQ').classList.add('show')});document.getElementById('nextQ').onclick=()=>{s.i++;s.answered=false;if(s.i>=s.list.length){const old=rec(s.level).best||0,isBest=s.score>old;if(isBest){saved.levels[s.level]={best:s.score};save()}state={screen:'result',score:s.score,total:s.list.length,level:s.level,newBest:isBest};render()}else render()}};
screens.result=()=>{const s=state;app.innerHTML=`<div class="card"><h2>レベル${s.level} けっか</h2>${progressHTML(s.score,s.total)}<div class="score">${s.score} / ${s.total}</div>${s.newBest?'<div class="newbest">🎉 さいこうきろく！<br>すごい！前よりできるようになったね！ 🏆</div>':''}<div class="row"><button class="btn pink" id="again">もう一度</button><button class="btn teal" id="homeBtn">ホーム</button></div></div>`;document.getElementById('again').onclick=()=>startLevel(s.level);document.getElementById('homeBtn').onclick=home};
const rows=[{jp:'私',subj:'I',poss:'my',obj:'me',possp:'mine'},{jp:'あなた',subj:'you',poss:'your',obj:'you',possp:'yours'},{jp:'彼',subj:'he',poss:'his',obj:'him',possp:'his'},{jp:'彼女',subj:'she',poss:'her',obj:'her',possp:'hers'},{jp:'それ',subj:'it',poss:'its',obj:'it',possp:'—'},{jp:'私たち',subj:'we',poss:'our',obj:'us',possp:'ours'},{jp:'あなたたち',subj:'you',poss:'your',obj:'you',possp:'yours'},{jp:'彼ら',subj:'they',poss:'their',obj:'them',possp:'theirs'}];
let tableState={timerId:null};const TIME_LIMIT=60;
function buildTable(){stopTimer();tableState={fill:{},active:null,graded:false,started:false,bank:[],left:TIME_LIMIT,endAt:null,timeUsed:null,newBest:false,timerId:null};const keys=[];rows.forEach((r,i)=>['subj','poss','obj','possp'].forEach(k=>{if(r[k]!=='—'&&Math.random()<.45)keys.push(`${i}_${k}`)}));rows.forEach((r,i)=>{if(!keys.some(x=>x.startsWith(i+'_'))){const ks=['subj','poss','obj','possp'].filter(k=>r[k]!=='—');keys.push(`${i}_${ks[Math.floor(Math.random()*ks.length)]}`)}});tableState.keys=keys;const words=keys.map(k=>{const [i,c]=k.split('_');return rows[+i][c]});tableState.bank=shuf(words.map((w,i)=>({id:i,w,used:null})));tableState.active=keys[0]}
function updateTimerDom(){const el=document.getElementById('timeNum'),box=document.getElementById('timerBox');if(el)el.textContent=Math.ceil(tableState.left)+'秒';if(box)box.classList.toggle('warn',tableState.left<=10)}
function startTimer(){if(tableState.graded)return;stopTimer();tableState.started=true;tableState.endAt=Date.now()+TIME_LIMIT*1000;tableState.left=TIME_LIMIT;updateTimerDom();tableState.timerId=setInterval(()=>{tableState.left=Math.max(0,(tableState.endAt-Date.now())/1000);updateTimerDom();if(tableState.left<=0){stopTimer();gradeTable(true)}},100)}
function tableCell(i,k){const key=`${i}_${k}`,val=rows[i][k];if(val==='—')return '—';if(!tableState.keys.includes(key))return val;const bid=tableState.fill[key],item=bid===undefined?null:tableState.bank.find(x=>x.id===bid);let cls='blank';if(tableState.active===key&&!tableState.graded)cls+=' active';let ans='';if(tableState.graded){const ok=item&&item.w===val;cls+=ok?' ok':' ng';if(!ok)ans=`<div class="answerline">正解 ${val}</div>`}return `<button class="${cls}" data-key="${key}">${item?item.w:'？'}</button>${ans}`}
function calcTableScore(){let ok=0;tableState.keys.forEach(k=>{const [i,c]=k.split('_'),bid=tableState.fill[k],item=tableState.bank.find(x=>x.id===bid);if(item&&item.w===rows[+i][c])ok++});return ok}
function gradeTable(timeUp=false){if(tableState.graded||!tableState.started)return;stopTimer();tableState.graded=true;tableState.timeUsed=timeUp?TIME_LIMIT:Math.max(0,TIME_LIMIT-tableState.left);const score=calcTableScore(),oldScore=saved.table.bestScore||0,oldTime=saved.table.bestTime;const better=score>oldScore||(score===oldScore&&score>0&&(oldTime==null||tableState.timeUsed<oldTime));saved.table.plays=(saved.table.plays||0)+1;if(better){saved.table.bestScore=score;saved.table.bestTime=tableState.timeUsed;tableState.newBest=true}save();render()}
function rerenderTableKeepingTimer(){const left=tableState.left,endAt=tableState.endAt,timerId=tableState.timerId,started=tableState.started;state={screen:'table'};render();tableState.left=left;tableState.endAt=endAt;tableState.timerId=timerId;tableState.started=started;updateTimerDom()}
screens.table=()=>{const score=tableState.graded?calcTableScore():0;if(!tableState.started&&!tableState.graded){app.innerHTML=`<button class="back" id="back">← もどる</button><div class="card start-card"><div class="start-icon">⏱️</div><div class="start-title">代名詞 早見表・タイムアタック</div><div class="recordbox">🏆 ベスト：${saved.table.bestScore||0}問${saved.table.bestTime!=null?' ／ '+saved.table.bestTime.toFixed(1)+'秒':''}　・　挑戦 ${saved.table.plays||0}回</div><div class="start-desc">制限時間は60秒。<br><b>スタートを押すまで問題は表示されません。</b><br>準備ができたら始めよう！</div><button class="start-btn" id="startAttack">スタート！</button></div>`;document.getElementById('back').onclick=home;document.getElementById('startAttack').onclick=()=>{tableState.started=true;render();startTimer()};return}app.innerHTML=`<button class="back" id="back">← もどる</button><div class="timer-sticky${tableState.left<=10?' warn':''}" id="timerBox"><span class="label">⏱ のこり時間</span><span class="time" id="timeNum">${Math.ceil(tableState.left)}秒</span></div><div class="card"><h2>代名詞 早見表・タイムアタック</h2><div class="recordbox">🏆 ベスト：${saved.table.bestScore||0}問${saved.table.bestTime!=null?' ／ '+saved.table.bestTime.toFixed(1)+'秒':''}　・　挑戦 ${saved.table.plays||0}回</div><div style="overflow-x:auto"><table><thead><tr><th>日本語</th><th>〜は/が</th><th>〜の</th><th>〜を/に</th><th>〜のもの</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${r.jp}</td><td>${tableCell(i,'subj')}</td><td>${tableCell(i,'poss')}</td><td>${tableCell(i,'obj')}</td><td>${tableCell(i,'possp')}</td></tr>`).join('')}</tbody></table></div>${tableState.graded?progressHTML(score,tableState.keys.length,'正解数'):''}<div class="bank">${tableState.graded?'':tableState.bank.map(x=>`<button class="word ${x.used!==null?'used':''}" data-id="${x.id}">${x.w}</button>`).join('')}</div>${tableState.graded?`<div class="feedback ${score===tableState.keys.length?'ok':'no'}">${score} / ${tableState.keys.length} 正解！　${tableState.timeUsed.toFixed(1)}秒</div>${tableState.newBest?'<div class="newbest">🏆 さいこうきろく更新！<br>すごい！今日のベストだよ！ 🎉</div>':''}<div class="row"><button class="btn pink" id="retry">もう一度</button><button class="btn teal" id="homeBtn">ホーム</button></div>`:`<div class="row"><button class="btn teal" id="grade">答え合わせ</button><button class="btn pink" id="retry">やり直す</button></div>`}</div>`;document.getElementById('back').onclick=home;if(tableState.graded){document.getElementById('retry').onclick=()=>{buildTable();state={screen:'table'};render()};document.getElementById('homeBtn').onclick=home;return}document.querySelectorAll('.blank').forEach(b=>b.onclick=()=>{const key=b.dataset.key;if(tableState.fill[key]!==undefined){const old=tableState.bank.find(x=>x.id===tableState.fill[key]);old.used=null;delete tableState.fill[key]}tableState.active=key;rerenderTableKeepingTimer()});document.querySelectorAll('.word').forEach(b=>b.onclick=()=>{const item=tableState.bank.find(x=>x.id===Number(b.dataset.id));if(item.used!==null){delete tableState.fill[item.used];item.used=null;rerenderTableKeepingTimer();return}let key=tableState.active;if(!key||tableState.fill[key]!==undefined)key=tableState.keys.find(k=>tableState.fill[k]===undefined);if(!key)return;tableState.fill[key]=item.id;item.used=key;tableState.active=tableState.keys.find(k=>tableState.fill[k]===undefined)||null;rerenderTableKeepingTimer()});document.getElementById('grade').onclick=()=>gradeTable(false);document.getElementById('retry').onclick=()=>{buildTable();state={screen:'table'};render()}};
render();
</script></body></html>
