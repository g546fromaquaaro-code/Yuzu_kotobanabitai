<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ことばナビ隊 〜英語なかま図鑑〜</title>
<style>
  :root{
    --ink:#3A3357;
    --ink-soft:#7C76A0;
    --ink-faint:#ADA8C6;
    --pink:#FF7BA9;
    --pink-soft:#FFE7F0;
    --coral:#FF9E7D;
    --lemon:#FFD166;
    --lemon-soft:#FFF6DC;
    --mint:#3ECFAF;
    --mint-soft:#DFF8F1;
    --lilac:#A88BEB;
    --lilac-soft:#EEE7FE;
    --sky:#7EC4F5;
    --sky-soft:#E4F2FD;
    --card:rgba(255,255,255,0.92);
    --line:#EFEBF8;
    --shadow: 0 10px 26px rgba(122,102,170,0.14);
    --shadow-sm: 0 4px 12px rgba(122,102,170,0.10);
    --radius: 26px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic Rounded","Hiragino Sans","Yu Gothic",sans-serif;
    color:var(--ink);
    min-height:100%;
    overscroll-behavior:none;
    background:#FDF9FF;
  }
  /* dreamy layered background */
  body::before{
    content:"";
    position:fixed; inset:0; z-index:-2;
    background:
      radial-gradient(680px 460px at 12% -6%, #FFE9F4 0%, transparent 62%),
      radial-gradient(620px 420px at 92% 4%, #E8E4FF 0%, transparent 60%),
      radial-gradient(560px 400px at 50% 104%, #DFF6FF 0%, transparent 62%),
      linear-gradient(180deg, #FFFBFE 0%, #FBF7FF 55%, #F6FCFF 100%);
  }
  body::after{
    content:"";
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.9) 0 2px, transparent 2px),
      radial-gradient(circle, rgba(255,220,240,0.9) 0 3px, transparent 3px);
    background-size: 120px 120px, 190px 190px;
    background-position: 20px 40px, 90px 130px;
    opacity:.55;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:96px;
    position:relative;
  }

  /* ---------- Header ---------- */
  header{padding:18px 16px 6px 16px;}
  .header-row{position:relative; display:flex; align-items:center; justify-content:center; min-height:52px;}
  header h1{
    font-size:21px; margin:0; letter-spacing:0.6px; text-align:center;
    background:linear-gradient(90deg, var(--pink), var(--lilac) 55%, var(--sky));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  header h1 .sub{
    display:block; font-size:11.5px; margin-top:4px; font-weight:normal;
    color:var(--ink-soft); -webkit-text-fill-color:var(--ink-soft);
  }
  .icon-btn{
    position:absolute; top:4px;
    width:40px; height:40px; border-radius:50%;
    border:none; background:rgba(255,255,255,0.9);
    font-size:17px; box-shadow:var(--shadow-sm);
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn.left{left:0;}
  .icon-btn.right{right:0;}
  .icon-btn.on{background:linear-gradient(135deg, var(--pink-soft), var(--lilac-soft));}

  .passport{display:flex; gap:8px; overflow-x:auto; padding:12px 16px 4px 16px; scrollbar-width:none;}
  .passport::-webkit-scrollbar{display:none;}
  .stamp{flex:0 0 auto; width:56px; text-align:center;}
  .stamp .circ{
    width:52px;height:52px;border-radius:50%;
    background:rgba(255,255,255,0.95);
    border:2.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:24px; box-shadow:var(--shadow-sm);
    filter:grayscale(1) opacity(0.5);
    transition:transform .3s cubic-bezier(.3,1.4,.5,1), filter .3s ease, border-color .3s ease;
  }
  .stamp.active .circ{filter:none; border-color: var(--fam-color, var(--pink)); transform:scale(1.07);}
  .stamp.full .circ{box-shadow:0 0 0 4px rgba(255,209,102,0.35), var(--shadow-sm);}
  .stamp .stars{font-size:10px; color:var(--lemon); margin-top:3px; letter-spacing:1px;}
  .stamp .nm{font-size:9px;color:var(--ink-faint);margin-top:1px;}

  main{padding:6px 16px 10px 16px;}
  .view{display:none;}
  .view.active{display:block; animation:fadeUp .28s ease;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Cards ---------- */
  .card{
    background:var(--card); backdrop-filter: blur(6px);
    border-radius:var(--radius); box-shadow:var(--shadow);
    padding:16px; margin-bottom:14px;
    border:1px solid rgba(255,255,255,0.7);
  }
  .fam-card{
    background:var(--card); backdrop-filter:blur(6px);
    border-radius:22px; box-shadow:var(--shadow-sm);
    margin-bottom:11px; overflow:hidden;
    border:2px solid rgba(255,255,255,0.8);
    transition:border-color .22s ease, transform .22s ease;
  }
  .fam-card.open{border-color:var(--fam-color); transform:translateY(-1px);}
  .fam-head{display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer;}
  .fam-emoji{
    width:46px;height:46px;border-radius:16px;
    background:var(--fam-bg, #eee);
    display:flex;align-items:center;justify-content:center;
    font-size:22px; flex:0 0 auto;
    transform:rotate(-4deg);
  }
  .fam-title{flex:1;}
  .fam-title b{font-size:16px;}
  .fam-title span{display:block; font-size:11px; color:var(--ink-faint); margin-top:1px;}
  .be-pill{
    display:inline-block; font-size:10px; font-weight:800;
    padding:2px 8px; border-radius:999px; margin-left:4px;
    background:var(--lilac-soft); color:var(--lilac);
  }
  .fam-arrow{font-size:13px; color:var(--ink-faint); transition:transform .22s ease;}
  .fam-card.open .fam-arrow{transform:rotate(180deg);}
  .fam-body{max-height:0; overflow:hidden; transition:max-height .32s ease; padding:0 14px;}
  .fam-card.open .fam-body{max-height:900px; padding:0 14px 14px 14px;}
  .form-row{
    display:flex; align-items:center; gap:11px;
    background:rgba(252,250,255,0.9); border-radius:16px;
    padding:10px 12px; margin-top:8px;
  }
  .form-en{font-weight:800; font-size:17px; color:var(--fam-color); min-width:54px;}
  .form-meta{flex:1;}
  .form-label{font-size:10.5px; color:var(--ink-faint);}
  .form-ex{font-size:12.5px; margin-top:2px; line-height:1.55;}
  .form-ex b{color:var(--ink);}

  /* ---------- Overview table ---------- */
  .overview-scroll{
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    border-radius:22px; box-shadow:var(--shadow); background:rgba(255,255,255,0.95);
  }
  table.overview-table{border-collapse:separate; border-spacing:0; width:100%; min-width:660px; font-size:12.5px;}
  table.overview-table th, table.overview-table td{border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:11px 6px; text-align:center;}
  table.overview-table thead th{
    background:linear-gradient(135deg, var(--lemon-soft), var(--pink-soft));
    color:#B05A85; font-weight:800; font-size:11.5px; position:sticky; top:0;
  }
  table.overview-table td.group-cell{background:var(--sky-soft); font-weight:800; color:#4A8CB8;}
  table.overview-table td.jp-cell{background:var(--pink-soft); font-weight:800; color:#D2568A;}
  table.overview-table td.be-cell{font-weight:800; color:var(--lilac); background:var(--lilac-soft);}
  table.overview-table td.en-cell{font-weight:700;}

  /* ---------- Quiz ---------- */
  .quiz-top{display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--ink-soft); margin-bottom:9px; padding:0 4px;}
  .quiz-top .streak{color:var(--pink); font-weight:800;}
  .qcard{
    background:var(--card); backdrop-filter:blur(6px);
    border-radius:var(--radius); box-shadow:var(--shadow);
    padding:20px 18px; text-align:center;
    border:1px solid rgba(255,255,255,0.8);
  }
  .qcard .qtag{
    display:inline-block; font-size:11px;
    background:var(--fam-bg,#eee); color:var(--fam-color,#666);
    padding:5px 12px; border-radius:999px; margin-bottom:10px; font-weight:700;
  }
  .qcard .qjp{font-size:13px; color:var(--ink-soft); margin-bottom:6px; line-height:1.6;}
  .qcard .qsentence{font-size:19px; font-weight:800; margin:8px 0 4px 0; line-height:1.6;}
  .qcard .qsentence .blank{display:inline-block; min-width:56px; border-bottom:3px solid var(--pink); color:var(--pink);}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
  .opt-btn{
    font-family:inherit; font-size:17px; font-weight:800;
    padding:15px 8px; border-radius:18px;
    border:2px solid var(--line); background:#fff; color:var(--ink);
    box-shadow:var(--shadow-sm); transition:transform .12s ease;
  }
  .opt-btn:active{transform:scale(0.96);}
  .opt-btn.correct{background:var(--mint-soft); border-color:var(--mint); color:#1F9B80;}
  .opt-btn.wrong{background:var(--pink-soft); border-color:var(--pink); color:#D2568A;}
  .opt-btn[disabled]{opacity:0.55;}
  .next-wrap{margin-top:16px; min-height:46px;}
  .btn-next{
    font-family:inherit; font-size:15px; font-weight:800;
    padding:13px 28px; border-radius:999px; border:none;
    background:linear-gradient(135deg, var(--pink), var(--coral));
    color:#fff; box-shadow:0 6px 16px rgba(255,123,169,0.4);
  }
  .btn-next:active{transform:scale(0.97);}
  .feedback-line{font-size:13px; margin-top:10px; min-height:18px; font-weight:700;}
  .feedback-line.ok{color:#1F9B80;}
  .feedback-line.ng{color:#D2568A;}

  /* ---------- Mode toggle / chips ---------- */
  .mode-toggle{display:flex; gap:7px; margin-bottom:12px;}
  .mode-btn{
    flex:1; font-family:inherit; font-size:11.5px; font-weight:800;
    padding:11px 4px; border-radius:16px; border:2px solid var(--line);
    background:rgba(255,255,255,0.9); color:var(--ink-faint);
  }
  .mode-btn.active{border-color:var(--pink); color:var(--pink); background:var(--pink-soft);}
  .chip-row{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px 2px; scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.95); border:2px solid var(--line);
    border-radius:999px; padding:8px 14px;
    font-size:13px; font-weight:800; color:var(--ink-faint);
    box-shadow:var(--shadow-sm);
  }
  .chip.active{border-color:var(--fam-color); color:var(--fam-color); background:var(--fam-bg);}

  /* ---------- Drill table ---------- */
  .drill-table{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; border:1px solid rgba(255,255,255,0.8);}
  .drill-row{display:flex; align-items:center; gap:10px; padding:12px 6px; border-bottom:1px dashed var(--line);}
  .drill-row:last-child{border-bottom:none;}
  .drill-label{width:98px; font-size:11.5px; color:var(--ink-soft); line-height:1.45;}
  .drill-blank{
    flex:1; height:44px; border-radius:14px;
    border:2px dashed var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:800; color:var(--ink-faint);
    background:rgba(252,250,255,0.9);
  }
  .drill-blank.selected{border-color:var(--fam-color); background:var(--fam-bg); color:var(--fam-color); border-style:solid;}
  .drill-blank.filled{border-style:solid; border-color:var(--mint); background:var(--mint-soft); color:#1F9B80;}
  .drill-choices{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .dchoice{
    font-family:inherit; font-size:15px; font-weight:800;
    padding:11px 17px; border-radius:14px; border:2px solid var(--line);
    background:#fff; color:var(--ink); box-shadow:var(--shadow-sm);
  }
  .dchoice:active{transform:scale(0.96);}
  .drill-done{text-align:center; padding:20px 0 4px 0;}
  .drill-done .big{font-size:36px;}

  /* ---------- Be-verb baskets ---------- */
  .basket-row{display:flex; gap:9px; margin-top:14px;}
  .basket{
    flex:1; background:rgba(252,250,255,0.9);
    border:2px dashed var(--line); border-radius:18px;
    padding:10px 6px; text-align:center; min-height:112px;
    transition:border-color .2s ease, background .2s ease;
  }
  .basket-label{font-size:18px; font-weight:800; margin-bottom:6px;
    background:linear-gradient(90deg, var(--pink), var(--lilac));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .basket-items{display:flex; flex-wrap:wrap; gap:4px; justify-content:center;}
  .basket-tag{font-size:10.5px; font-weight:800; padding:4px 7px; border-radius:9px;}

  /* ---------- Arrange (word order) ---------- */
  .arrange-slot{
    min-height:56px; border-radius:18px;
    border:2px dashed var(--line); background:rgba(252,250,255,0.9);
    display:flex; flex-wrap:wrap; gap:7px; align-items:center;
    padding:10px; margin-top:12px;
  }
  .arrange-slot.done{border-style:solid; border-color:var(--mint); background:var(--mint-soft);}
  .arrange-slot .placeholder{font-size:12px; color:var(--ink-faint); margin:auto;}
  .word-tile{
    font-family:inherit; font-size:15px; font-weight:800;
    padding:10px 14px; border-radius:13px; border:2px solid var(--line);
    background:#fff; color:var(--ink); box-shadow:var(--shadow-sm);
  }
  .word-tile:active{transform:scale(0.95);}
  .word-tile.placed{background:linear-gradient(135deg, var(--pink-soft), var(--lilac-soft)); border-color:var(--pink); color:#C9508A;}
  .word-tile[disabled]{opacity:0.3;}
  .word-bank{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; justify-content:center;}
  .arrange-actions{display:flex; gap:8px; margin-top:14px;}
  .btn-ghost{
    flex:1; font-family:inherit; font-size:13px; font-weight:800;
    padding:12px 6px; border-radius:16px; border:2px solid var(--line);
    background:rgba(255,255,255,0.9); color:var(--ink-soft);
  }
  .btn-solid{
    flex:1; font-family:inherit; font-size:13px; font-weight:800;
    padding:12px 6px; border-radius:16px; border:none;
    background:linear-gradient(135deg, var(--mint), var(--sky));
    color:#fff; box-shadow:0 6px 16px rgba(62,207,175,0.35);
  }

  /* ---------- Zukan ---------- */
  .zukan-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .zcard{
    background:var(--card); border-radius:22px; box-shadow:var(--shadow-sm);
    padding:14px; text-align:center; border:1px solid rgba(255,255,255,0.8);
  }
  .zcard .zemoji{
    width:62px;height:62px;border-radius:20px;
    background:var(--fam-bg,#eee);
    display:flex;align-items:center;justify-content:center;
    font-size:28px;margin:0 auto 8px auto;
    filter:grayscale(1) opacity(0.45);
    transform:rotate(-4deg);
  }
  .zcard.on .zemoji{filter:none;}
  .zcard .zname{font-size:13px; font-weight:800;}
  .zcard .zstars{font-size:14px; color:var(--lemon); margin-top:4px; letter-spacing:2px;}
  .zcard .zcount{font-size:10px; color:var(--ink-faint); margin-top:2px;}
  .zsummary{
    display:flex; justify-content:space-between; align-items:center;
    background:linear-gradient(135deg, #FFE7F0, #EEE7FE 55%, #E4F2FD);
    border-radius:24px; padding:18px; margin-bottom:14px;
    box-shadow:var(--shadow-sm);
  }
  .zsummary .znum{font-size:27px; font-weight:800; color:var(--lilac);}
  .zsummary .zlabel{font-size:11px; color:var(--ink-soft);}
  .progress-track{height:10px; border-radius:999px; background:rgba(255,255,255,0.75); overflow:hidden; margin-top:8px; width:150px;}
  .progress-fill{height:100%; border-radius:999px; background:linear-gradient(90deg, var(--pink), var(--lemon)); transition:width .5s ease;}

  /* ---------- Settings ---------- */
  .set-row{
    display:flex; align-items:center; gap:12px;
    padding:14px 4px; border-bottom:1px dashed var(--line);
  }
  .set-row:last-child{border-bottom:none;}
  .set-ic{
    width:38px;height:38px;border-radius:13px; flex:0 0 auto;
    display:flex;align-items:center;justify-content:center; font-size:18px;
    background:var(--lilac-soft);
  }
  .set-meta{flex:1;}
  .set-meta b{font-size:14px;}
  .set-meta span{display:block; font-size:11px; color:var(--ink-faint); margin-top:2px; line-height:1.4;}
  .switch{
    width:52px;height:30px;border-radius:999px; border:none;
    background:#E4E0F0; position:relative; flex:0 0 auto; transition:background .22s ease;
  }
  .switch::after{
    content:""; position:absolute; top:3px; left:3px;
    width:24px;height:24px;border-radius:50%; background:#fff;
    box-shadow:0 2px 5px rgba(0,0,0,0.16); transition:transform .22s cubic-bezier(.3,1.4,.5,1);
  }
  .switch.on{background:linear-gradient(135deg, var(--pink), var(--lilac));}
  .switch.on::after{transform:translateX(22px);}
  input[type=range]{
    -webkit-appearance:none; width:110px; height:6px; border-radius:999px;
    background:linear-gradient(90deg, var(--pink), var(--lilac)); flex:0 0 auto;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:22px;height:22px;border-radius:50%;
    background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.22); border:2px solid var(--pink);
  }
  .theme-row{display:flex; gap:9px; margin-top:4px;}
  .theme-swatch{
    flex:1; height:52px; border-radius:16px; border:3px solid transparent;
    display:flex; align-items:flex-end; justify-content:center;
    font-size:9.5px; font-weight:800; color:rgba(255,255,255,0.95);
    padding-bottom:5px; box-shadow:var(--shadow-sm);
  }
  .theme-swatch.active{border-color:var(--ink); }
  .reset-btn{
    display:block; width:100%; margin-top:6px;
    background:rgba(255,255,255,0.9); border:2px solid var(--pink-soft); color:#D2568A;
    font-family:inherit; font-size:12.5px; font-weight:800; padding:12px 14px; border-radius:16px;
  }

  /* ---------- Tab bar ---------- */
  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0;
    max-width:520px; margin:0 auto;
    background:rgba(255,255,255,0.93); backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    display:flex;
    padding:7px 5px calc(7px + env(safe-area-inset-bottom,0px)) 5px;
    box-shadow:0 -6px 18px rgba(122,102,170,0.09);
  }
  nav.tabbar button{
    flex:1; font-family:inherit; background:none; border:none;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:6px 1px; color:var(--ink-faint); font-size:9px; font-weight:700;
    border-radius:16px; transition:color .2s ease, background .2s ease;
  }
  nav.tabbar button .ic{font-size:19px; transition:transform .25s cubic-bezier(.3,1.5,.5,1);}
  nav.tabbar button.active{color:var(--pink); background:linear-gradient(160deg, var(--pink-soft), rgba(255,255,255,0));}
  nav.tabbar button.active .ic{transform:translateY(-2px) scale(1.12);}

  /* ---------- Toast / confetti / celebrate ---------- */
  #toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background:rgba(58,51,87,0.93); color:#fff; padding:11px 20px;
    border-radius:999px; font-size:13px; font-weight:700; z-index:50;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(6px);}
  #audioHint{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
    background:linear-gradient(135deg, var(--lilac), var(--pink));
    color:#fff; padding:10px 18px; border-radius:999px;
    font-size:12px; font-weight:800; z-index:55;
    box-shadow:0 8px 20px rgba(168,139,235,0.45);
    animation: floaty 1.8s ease-in-out infinite;
  }
  @keyframes floaty{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-6px);}}
  .confetti{position:fixed; font-size:22px; z-index:60; pointer-events:none; animation: pop-fly 0.95s ease-out forwards;}
  @keyframes pop-fly{
    0%{opacity:1; transform:translateY(0) scale(0.5) rotate(0deg);}
    30%{transform:translateY(-20px) scale(1.15) rotate(12deg);}
    100%{opacity:0; transform:translateY(-78px) scale(1) rotate(-14deg);}
  }
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .shake{animation:shake .35s ease;}
  .celebrate-overlay{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:80; opacity:0; transition:opacity .25s ease;}
  .celebrate-overlay.show{opacity:1;}
  .celebrate-card{
    background:rgba(255,255,255,0.97); border-radius:28px; padding:28px 36px; text-align:center;

(function loadSettings(){
  try{
    var raw = localStorage.getItem(SET_KEY);

      var p = JSON.parse(raw);
      if(typeof p.bgm === "boolean") settings.bgm = p.bgm;

})();
function saveSettings(){
  try{ localStorage.setItem(SET_KEY, JSON.stringify(settings)); }catch(e){}
}
function applyTheme(){

  THEMES.forEach(function(x){ if(x.id === settings.theme) t = x; });

    document.documentElement.style.setProperty(k, t.vars[k]);
  });
}

/* ============ MASTERY ============ */
var STORAGE_KEY = "pronounQuest_mastery_v1";
var mastery = loadMastery();
var currentView = "learn";
var quizState = { streak:0, current:null };
var drillState = { famId:"I", selected:null, filled:{} };
var drillMode = "table";
var beDrillState = { placed:{}, selected:null };
var arrangeState = { q:null, placed:[], bank:[], checked:false };

function loadMastery(){
  var m = {};
  FAMILIES.forEach(function(f){ m[f.id] = {correct:0}; });
  m.beVerb = {rounds:0};
  m.arrange = {correct:0};
  m.graduated = false;
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      var p = JSON.parse(raw);
      Object.keys(p).forEach(function(k){
        if(k === "beVerb" && p.beVerb){ m.beVerb.rounds = p.beVerb.rounds || 0; }
        else if(k === "arrange" && p.arrange){ m.arrange.correct = p.arrange.correct || 0; }
        else if(k === "graduated"){ m.graduated = !!p.graduated; }
        else if(m[k] && p[k]){ m[k].correct = p[k].correct || 0; }
      });
    }
  }catch(e){}
  return m;
}
function saveMastery(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(mastery)); }catch(e){}
}
function addCorrect(famId, n){
  if(!mastery[famId]) mastery[famId] = {correct:0};
  mastery[famId].correct += n;
  saveMastery();
}
function starsFor(famId){
  var c = (mastery[famId] && mastery[famId].correct) || 0;
  if(c >= 10) return 3;
  if(c >= 6) return 2;
  if(c >= 3) return 1;
  return 0;
}
function starsForBeVerb(){ return Math.min(3, mastery.beVerb.rounds); }
function starsForArrange(){
  var c = mastery.arrange.correct;
  if(c >= 12) return 3;
  if(c >= 7) return 2;
  if(c >= 3) return 1;
  return 0;
}
function totalStars(){
  var t=0; FAMILIES.forEach(function(f){ t += starsFor(f.id); }); return t;
}
function grandTotal(){ return totalStars() + starsForBeVerb() + starsForArrange(); }
function grandMax(){ return FAMILIES.length*3 + 3 + 3; }
function checkGraduation(){
  if(mastery.graduated) return;
  if(grandTotal() >= grandMax()){
    mastery.graduated = true;
    saveMastery();
    setTimeout(function(){ celebrate("🎓","ぜんぶマスター！ にんめい状 GET！", true); }, 450);
  }
}

/* ============ AUDIO ============ */
var actx = null;
function ensureAudio(){
  if(!actx){
    try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  }
  if(actx && actx.state === "suspended"){ actx.resume(); }
}
function beep(freq, start, dur, type, vol){
  if(!actx) return;
  var o = actx.createOscillator();
  var g = actx.createGain();
  o.type = type || "sine";
  o.frequency.value = freq;
  g.gain.value = 0;
  o.connect(g); g.connect(actx.destination);
  var t0 = actx.currentTime + start;
  g.gain.linearRampToValueAtTime(vol || 0.18, t0 + 0.02);
  g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
  o.start(t0);
  o.stop(t0 + dur + 0.02);
}
function playCorrect(){
  if(!settings.sfx) return;
  ensureAudio();
  beep(523.25, 0, 0.12, "sine", 0.2);
  beep(659.25, 0.1, 0.12, "sine", 0.2);
  beep(783.99, 0.2, 0.18, "sine", 0.22);
}
function playWrong(){
  if(!settings.sfx) return;
  ensureAudio();
  beep(200, 0, 0.18, "sawtooth", 0.11);
}
function playStamp(){
  if(!settings.sfx) return;
  ensureAudio();
  beep(880, 0, 0.08, "square", 0.14);
  beep(1046.5, 0.08, 0.14, "square", 0.14);
  beep(1318.5, 0.18, 0.2, "square", 0.12);
}
function playTap(){
  if(!settings.sfx) return;
  ensureAudio();
  beep(620, 0, 0.05, "sine", 0.07);
}

/* ============ BGM ============ */
var bgmTimer = null, bgmRunning = false, bgmIndex = 0, audioUnlocked = false;
var BGM_NOTES = [523.25,587.33,659.25,783.99,880.00,783.99,659.25,587.33,523.25,659.25,783.99,659.25];
var BGM_BASS  = [261.63,null,329.63,null,392.00,null,329.63,null,261.63,null,392.00,null];
function bgmStep(){
  if(!settings.bgm){ bgmRunning = false; return; }
  bgmRunning = true;
  if(actx && actx.state === "running"){
    var v = 0.05 * settings.bgmVolume * 2;
    beep(BGM_NOTES[bgmIndex % BGM_NOTES.length], 0, 0.5, "sine", v);
    var b = BGM_BASS[bgmIndex % BGM_BASS.length];
    if(b){ beep(b, 0, 0.45, "triangle", v*0.55); }
  }
  bgmIndex++;
  bgmTimer = setTimeout(bgmStep, 430);
}
function startBgm(){
  settings.bgm = true; saveSettings();
  ensureAudio();
  clearTimeout(bgmTimer); bgmRunning = false;
  bgmStep();
  updateBgmButton();
}
function stopBgm(){
  settings.bgm = false; saveSettings();
  clearTimeout(bgmTimer); bgmRunning = false;
  updateBgmButton();
}
function updateBgmButton(){
  var b = document.getElementById("bgmBtn");
  if(!b) return;
  b.textContent = settings.bgm ? "🎵" : "🔇";
  b.classList.toggle("on", settings.bgm);
}

  var el = document.createElement("div");
  el.id = "audioHint";
  el.textContent = "タップして音楽スタート 🎵";
  document.body.appendChild(el);
}
function hideAudioHint(){
  var el = document.getElementById("audioHint");
  if(el) el.remove();
}
function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  ensureAudio();
  hideAudioHint();
  if(settings.bgm && !bgmRunning){ bgmStep(); }
}

/* ============ TOAST / CONFETTI / CELEBRATE ============ */
var toastTimer = null;
function showToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1400);
}
var CONFETTI_EMOJI = ["✨","🎉","⭐","🌟","💮","🎊","🩷"];
function burstConfetti(x, y, count){
  if(!settings.celebrate) return;
  count = count || 6;
  for(var i=0;i<count;i++){
    (function(i){
      var el = document.createElement("div");
      el.className = "confetti";
      el.textContent = CONFETTI_EMOJI[i % CONFETTI_EMOJI.length];
      el.style.left = (x + (Math.random()*74-37)) + "px";
      el.style.top = (y + (Math.random()*14-7)) + "px";
      document.body.appendChild(el);
      setTimeout(function(){ el.remove(); }, 980);
    })(i);
  }
}
var celebrateTimer = null;
function celebrate(emoji, msg, big){
  if(!settings.celebrate){ showToast(msg); return; }
  var overlay = document.getElementById("celebrateOverlay");
  overlay.innerHTML = '<div class="celebrate-card"><div class="emoji">'+emoji+'</div><div class="msg">'+msg+'</div></div>';
  overlay.classList.add("show");
  playStamp();
  burstConfetti(window.innerWidth/2, window.innerHeight/2, big ? 22 : 10);
  clearTimeout(celebrateTimer);
  celebrateTimer = setTimeout(function(){ overlay.classList.remove("show"); }, big ? 2200 : 1500);
}

/* ============ HELPERS ============ */
function familyById(id){ var r=null; FAMILIES.forEach(function(f){ if(f.id===id) r=f; }); return r; }
function formByKey(fam, key){ var r=null; fam.forms.forEach(function(fo){ if(fo.key===key) r=fo; }); return r; }
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function starRow(n){ return "★".repeat(n) + "☆".repeat(3-n); }
function awardFamily(fam, srcEl){
  var prev = starsFor(fam.id);
  addCorrect(fam.id, 1);
  var now = starsFor(fam.id);
  renderPassport();
  if(srcEl){ var r = srcEl.getBoundingClientRect(); burstConfetti(r.left+r.width/2, r.top); }
  if(now > prev){
    setTimeout(function(){
      celebrate(fam.emoji, fam.name+" ★"+now+" たっせい！", now===3);
      checkGraduation();
    }, 250);
  }
  return now > prev;
}

/* ============ QUIZ ============ */
var ALL_WORDS = [];
(function(){
  var seen = {};
  FAMILIES.forEach(function(f){ f.forms.forEach(function(fo){ if(!seen[fo.en]){seen[fo.en]=1; ALL_WORDS.push(fo.en);} }); });
})();
function pickQuestion(){
  var f = FAMILIES[Math.floor(Math.random()*FAMILIES.length)];
  var form = f.forms[Math.floor(Math.random()*f.forms.length)];
  var d = shuffle(ALL_WORDS.filter(function(w){ return w !== form.en; })).slice(0,3);
  return { fam:f, form:form, options:shuffle([form.en].concat(d)) };
}
function renderQuiz(){
  quizState.current = pickQuestion();
  var f = quizState.current.fam, form = quizState.current.form;
  var qcard = document.getElementById("qcard");
  qcard.style.setProperty("--fam-color", f.color);
  qcard.style.setProperty("--fam-bg", f.bg);
  qcard.innerHTML =
    '<div class="qtag">'+f.emoji+' '+f.name+' の '+form.label+'</div>' +
    '<div class="qjp">'+form.jp+'</div>' +
    '<div class="qsentence">'+form.blank.replace("___",'<span class="blank">＿＿＿</span>')+'</div>' +
    '<div class="options" id="optWrap"></div>' +
    '<div class="feedback-line" id="feedback"></div>' +
    '<div class="next-wrap" id="nextWrap"></div>';
  var optWrap = document.getElementById("optWrap");
  quizState.current.options.forEach(function(word){
    var btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.textContent = word;
    btn.addEventListener("click", function(){ handleAnswer(word, btn); });
    optWrap.appendChild(btn);
  });
  updateStreakLabel();
}
function updateStreakLabel(){
  var fire = quizState.streak >= 5 ? " 🔥" : "";
  document.getElementById("streakLabel").textContent = "れんぞく正解 "+quizState.streak+fire;
}
function handleAnswer(word, btnEl){
  var form = quizState.current.form, fam = quizState.current.fam;
  var correct = (word === form.en);
  document.querySelectorAll("#optWrap .opt-btn").forEach(function(b){
    b.disabled = true;
    if(b.textContent === form.en) b.classList.add("correct");
  });
  var fb = document.getElementById("feedback");
  if(correct){
    quizState.streak += 1;
    playCorrect();
    fb.className = "feedback-line ok";
    fb.textContent = randomPraise()+" 「"+form.full+"」";
    awardFamily(fam, btnEl);
    if(quizState.streak === 5){ setTimeout(function(){ showToast("5れんぞく！ 火がついた🔥"); }, 700); }
    if(quizState.streak === 10){ setTimeout(function(){ celebrate("🔥","10れんぞく正解！すごい！", true); }, 700); }
  } else {
    quizState.streak = 0;
    btnEl.classList.add("wrong");
    playWrong();
    fb.className = "feedback-line ng";
    fb.textContent = "おしい！ 正解は 「"+form.en+"」でした。";
  }
  updateStreakLabel();
  var nw = document.getElementById("nextWrap");
  var nb = document.createElement("button");
  nb.className = "btn-next";
  nb.textContent = "つぎの問題へ →";
  nb.addEventListener("click", function(){ playTap(); renderQuiz(); });
  nw.innerHTML = ""; nw.appendChild(nb);
}

/* ---- Drill 1: table ---- */
function renderDrillChips(){
  var wrap = document.getElementById("drillChips");
  wrap.innerHTML = "";

    var chip = document.createElement("div");
    chip.className = "chip" + (drillState.famId === f.id ? " active" : "");

    chip.style.setProperty("--fam-bg", f.bg);
    chip.innerHTML = '<span>'+f.emoji+'</span><span>'+f.name+'</span>';
    chip.addEventListener("click", function(){
      playTap();
      drillState.famId = f.id; drillState.selected = null; drillState.filled = {};
      renderDrillChips(); renderDrillTable();
    });
    wrap.appendChild(chip);
  });
}
function renderDrillTable(){
  var fam = familyById(drillState.famId);
  var table = document.getElementById("drillTable");
  table.style.setProperty("--fam-color", fam.color);
  var allDone = fam.forms.every(function(fo){ return drillState.filled[fo.key]; });
  if(allDone){
    table.innerHTML =
      '<div class="drill-done"><div class="big">🎉</div>' +
      '<div style="font-weight:800;margin:8px 0;">'+fam.emoji+' '+fam.name+' コンプリート！</div>' +
      '<div style="font-size:12px;color:#ADA8C6;">ほかのなかまにも挑戦してみよう</div></div>';
    return;
  }
  var html = "";
  fam.forms.forEach(function(fo){
    var filled = drillState.filled[fo.key], sel = drillState.selected === fo.key;
    html += '<div class="drill-row"><div class="drill-label">'+FORM_ROW_LABEL[fo.key]+'</div>' +
      '<div class="drill-blank'+(filled?" filled":(sel?" selected":""))+'" data-key="'+fo.key+'">'+
      (filled ? fo.en : (sel ? "？" : ""))+'</div></div>';
  });
  table.innerHTML = html;
  table.querySelectorAll(".drill-blank").forEach(function(el){
    el.addEventListener("click", function(){
      var key = el.getAttribute("data-key");
      if(drillState.filled[key]) return;
      playTap(); drillState.selected = key;
      renderDrillTable(); renderDrillChoices();
    });
  });
  renderDrillChoices();
}
function renderDrillChoices(){
  var fam = familyById(drillState.famId);
  var old = document.getElementById("drillChoices");
  if(old) old.remove();
  if(!drillState.selected) return;
  var wrap = document.createElement("div");
  wrap.className = "drill-choices"; wrap.id = "drillChoices";
  shuffle(fam.forms.map(function(f){ return f.en; })).forEach(function(word){
    var b = document.createElement("button");
    b.className = "dchoice"; b.textContent = word;
    b.addEventListener("click", function(){
      var target = formByKey(fam, drillState.selected);
      if(word === target.en){
        drillState.filled[target.key] = true;
        drillState.selected = null;
        playCorrect();
        awardFamily(fam, b);
        showToast(randomPraise());
        renderDrillTable();
      } else {
        playWrong();
        var t = document.getElementById("drillTable");
        t.classList.add("shake");
        setTimeout(function(){ t.classList.remove("shake"); }, 350);
      }
    });
    wrap.appendChild(b);
  });
  document.getElementById("drillTable").appendChild(wrap);
}

function renderBeDrill(){
  var area = document.getElementById("beverbArea");
  var remaining = BEVERB_ITEMS.filter(function(it){ return !beDrillState.placed[it.id]; });

  var header =

      '<div style="font-size:13px;color:#7C76A0;font-weight:700;">be動詞とセットでおぼえよう(am / is / are)</div>' +

    '</div>';
  if(remaining.length === 0){
    area.innerHTML = header +
      '<div class="card drill-done"><div class="big">🎉</div>' +
      '<div style="font-weight:800;margin:8px 0;">be動詞パーフェクト！</div>' +
      '<button class="btn-next" id="beRetryBtn">もう一度あそぶ →</button></div>';
    document.getElementById("beRetryBtn").addEventListener("click", function(){
      playTap(); beDrillState.placed = {}; beDrillState.selected = null; renderBeDrill();
    });
    return;
  }
  var chips = '<div class="chip-row">';
  remaining.forEach(function(it){
    chips += '<div class="chip'+(beDrillState.selected===it.id?" active":"")+'" data-id="'+it.id+
      '" style="--fam-color:'+it.color+';--fam-bg:'+it.bg+';"><span>'+it.emoji+'</span><span>'+it.label+'</span></div>';
  });
  chips += '</div>';
  var baskets = '<div class="basket-row">';
  ["am","is","are"].forEach(function(bv){
    var tags = BEVERB_ITEMS.filter(function(it){ return beDrillState.placed[it.id]===bv; }).map(function(it){
      return '<span class="basket-tag" style="background:'+it.bg+';color:'+it.color+';">'+it.emoji+' '+it.label+'</span>';
    }).join("");
    baskets += '<div class="basket" data-be="'+bv+'"><div class="basket-label">'+bv+'</div><div class="basket-items">'+tags+'</div></div>';
  });
  baskets += '</div>';
  area.innerHTML = header +
    '<div class="card"><div style="font-size:11.5px;color:#ADA8C6;margin-bottom:8px;">①なかまをタップ → ②正しいbe動詞のカゴをタップ</div>' +
    chips + baskets + '</div>';
  area.querySelectorAll(".chip").forEach(function(el){
    el.addEventListener("click", function(){
      playTap(); beDrillState.selected = el.getAttribute("data-id"); renderBeDrill();
    });
  });
  area.querySelectorAll(".basket").forEach(function(el){
    el.addEventListener("click", function(){ onBasketTap(el.getAttribute("data-be"), el); });
  });
}
function onBasketTap(basket, el){
  if(!beDrillState.selected) return;
  var item = null;
  BEVERB_ITEMS.forEach(function(it){ if(it.id === beDrillState.selected) item = it; });
  if(!item) return;
  if(item.be === basket){
    beDrillState.placed[item.id] = basket;
    beDrillState.selected = null;
    playCorrect();
    var r = el.getBoundingClientRect();
    burstConfetti(r.left+r.width/2, r.top);
    renderBeDrill();
    if(BEVERB_ITEMS.filter(function(it){ return !beDrillState.placed[it.id]; }).length === 0){
      var prev = starsForBeVerb();
      mastery.beVerb.rounds += 1; saveMastery();
      var now = starsForBeVerb();
      setTimeout(function(){
        celebrate("🔤", randomPraise()+" be動詞クリア！("+mastery.beVerb.rounds+"回目)", now>prev);
        checkGraduation();
      }, 250);
    }
  } else {
    playWrong();
    el.classList.add("shake");
    setTimeout(function(){ el.classList.remove("shake"); }, 350);
  }
}

/* ---- Drill 3: arrange (word order) ---- */
function newArrangeQuestion(){
  var q = ARRANGE_Q[Math.floor(Math.random()*ARRANGE_Q.length)];
  arrangeState.q = q;
  arrangeState.placed = [];
  arrangeState.bank = shuffle(q.words.map(function(w,i){ return {w:w, i:i}; }));
  arrangeState.checked = false;
  renderArrange();
}
function renderArrange(){
  var area = document.getElementById("arrangeArea");
  if(!area) return;
  var q = arrangeState.q;
  var fam = familyById(q.famId);
  var stars = starsForArrange();

  var slotHtml = "";
  if(arrangeState.placed.length === 0){
    slotHtml = '<span class="placeholder">下のことばをタップして 文をつくろう</span>';
  } else {
    arrangeState.placed.forEach(function(tok, idx){
      slotHtml += '<button class="word-tile placed" data-slot="'+idx+'">'+tok.w+'</button>';
    });
  }
  var bankHtml = "";
  arrangeState.bank.forEach(function(tok, idx){
    var used = arrangeState.placed.some(function(p){ return p.i === tok.i; });
    bankHtml += '<button class="word-tile" data-bank="'+idx+'"'+(used?" disabled":"")+'>'+tok.w+'</button>';
  });

  var complete = arrangeState.placed.length === q.words.length;

  area.innerHTML =
    '<div class="card" style="text-align:center;padding:14px;">' +
      '<div style="font-size:13px;color:#7C76A0;font-weight:700;">日本語にあう英文を つくろう</div>' +
      '<div style="font-size:11px;color:#ADA8C6;margin-top:5px;">せいかい '+mastery.arrange.correct+'問　'+starRow(stars)+'</div>' +
    '</div>' +
    '<div class="card" style="--fam-color:'+fam.color+';">' +
      '<div style="text-align:center;">' +
        '<span class="qtag" style="background:'+fam.bg+';color:'+fam.color+';display:inline-block;font-size:11px;padding:5px 12px;border-radius:999px;font-weight:700;">'+fam.emoji+' '+fam.name+'</span>' +
        '<div style="font-size:14.5px;font-weight:800;margin-top:10px;line-height:1.6;">'+q.jp+'</div>' +
      '</div>' +
      '<div class="arrange-slot'+(arrangeState.checked?" done":"")+'" id="arrangeSlot">'+slotHtml+'</div>' +
      '<div class="word-bank">'+bankHtml+'</div>' +
      '<div class="feedback-line" id="arrangeFeedback" style="text-align:center;"></div>' +
      '<div class="arrange-actions">' +
        '<button class="btn-ghost" id="arrangeClear">やりなおす</button>' +
        (arrangeState.checked
          ? '<button class="btn-solid" id="arrangeNext">つぎの問題へ →</button>'
          : '<button class="btn-solid" id="arrangeCheck"'+(complete?"":" disabled style=\"opacity:.45\"")+'>こたえあわせ</button>') +
      '</div>' +
    '</div>';

  area.querySelectorAll("[data-bank]").forEach(function(btn){
    btn.addEventListener("click", function(){
      if(arrangeState.checked || btn.disabled) return;
      playTap();
      arrangeState.placed.push(arrangeState.bank[parseInt(btn.getAttribute("data-bank"),10)]);
      renderArrange();
    });
  });
  area.querySelectorAll("[data-slot]").forEach(function(btn){
    btn.addEventListener("click", function(){
      if(arrangeState.checked) return;
      playTap();
      arrangeState.placed.splice(parseInt(btn.getAttribute("data-slot"),10), 1);
      renderArrange();
    });
  });
  var clearBtn = document.getElementById("arrangeClear");
  if(clearBtn) clearBtn.addEventListener("click", function(){
    playTap(); arrangeState.placed = []; arrangeState.checked = false; renderArrange();
  });
  var checkBtn = document.getElementById("arrangeCheck");
  if(checkBtn) checkBtn.addEventListener("click", function(){ checkArrange(checkBtn); });
  var nextBtn = document.getElementById("arrangeNext");
  if(nextBtn) nextBtn.addEventListener("click", function(){ playTap(); newArrangeQuestion(); });
}
function checkArrange(btnEl){
  var q = arrangeState.q;
  var made = arrangeState.placed.map(function(t){ return t.w; }).join(" ");
  var answer = q.words.join(" ");
  var fb = document.getElementById("arrangeFeedback");
  if(made === answer){
    arrangeState.checked = true;
    mastery.arrange.correct += 1;
    var prev = starsForArrange();
    saveMastery();
    var now = starsForArrange();
    playCorrect();
    var fam = familyById(q.famId);
    awardFamily(fam, btnEl);
    renderArrange();
    var fb2 = document.getElementById("arrangeFeedback");
    fb2.className = "feedback-line ok";
    fb2.textContent = randomPraise()+" "+answer;
    if(now > prev){
      setTimeout(function(){
        celebrate("🧩", "並べ替え ★"+now+" たっせい！", now===3);
        checkGraduation();
      }, 400);
    }
  } else {
    playWrong();
    fb.className = "feedback-line ng";
    fb.textContent = "うーん、じゅんばんがちがうみたい。もう一度！";
    var slot = document.getElementById("arrangeSlot");
    slot.classList.add("shake");
    setTimeout(function(){ slot.classList.remove("shake"); }, 350);
  }
}

  card.innerHTML =
    '<div class="set-row">' +
      '<div class="set-ic" style="background:#FFE7F0;">🎵</div>' +
      '<div class="set-meta"><b>BGM</b><span>やさしいループ音楽を流します</span></div>' +
      '<button class="switch'+(settings.bgm?" on":"")+'" id="swBgm"></button>' +
    '</div>' +
    '<div class="set-row">' +
      '<div class="set-ic" style="background:#EEE7FE;">🔊</div>' +
      '<div class="set-meta"><b>BGMの音量</b><span>ちいさく〜おおきく</span></div>' +
      '<input type="range" id="rgVol" min="0" max="1" step="0.05" value="'+settings.bgmVolume+'">' +
    '</div>' +
    '<div class="set-row">' +
      '<div class="set-ic" style="background:#DFF8F1;">🔔</div>' +
      '<div class="set-meta"><b>こうか音</b><span>正解・まちがいの音</span></div>' +
      '<button class="switch'+(settings.sfx?" on":"")+'" id="swSfx"></button>' +
    '</div>' +
    '<div class="set-row">' +
      '<div class="set-ic" style="background:#FFF6DC;">🎉</div>' +
      '<div class="set-meta"><b>おいわい演出</b><span>紙ふぶきとポップアップ</span></div>' +
      '<button class="switch'+(settings.celebrate?" on":"")+'" id="swCel"></button>' +
    '</div>';

  document.getElementById("swBgm").addEventListener("click", function(){
    if(settings.bgm){ stopBgm(); } else { startBgm(); }
    renderSettings();
  });
  document.getElementById("swSfx").addEventListener("click", function(){
    settings.sfx = !settings.sfx; saveSettings(); playTap(); renderSettings();
  });
  document.getElementById("swCel").addEventListener("click", function(){
    settings.celebrate = !settings.celebrate; saveSettings(); playTap(); renderSettings();
  });
  var vol = document.getElementById("rgVol");
  vol.addEventListener("input", function(){
    settings.bgmVolume = parseFloat(vol.value); saveSettings();
  });

  var row = document.getElementById("themeRow");
  row.innerHTML = "";
  THEMES.forEach(function(t){
    var sw = document.createElement("div");
    sw.className = "theme-swatch" + (settings.theme === t.id ? " active" : "");
    sw.style.background = t.swatch;
    sw.textContent = t.name;
    sw.addEventListener("click", function(){
      playTap();
      settings.theme = t.id; saveSettings(); applyTheme();
      renderSettings(); renderPassport();
      showToast(t.name+"テーマに変えました");
    });
    row.appendChild(sw);
  });
}

/* ============ NAV ============ */
function switchView(name){
  currentView = name;
  document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
  document.getElementById("view-"+name).classList.add("active");
  document.querySelectorAll(".tab-btn").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-view") === name);
  });
  if(name === "overview") renderOverview();
  if(name === "quiz") renderQuiz();
  if(name === "drill"){ renderDrillModeToggle(); renderDrillBody(); }
  if(name === "zukan") renderZukan();
  if(name === "settings") renderSettings();
  window.scrollTo(0,0);
}
document.querySelectorAll(".tab-btn").forEach(function(btn){
  btn.addEventListener("click", function(){ playTap(); switchView(btn.getAttribute("data-view")); });
});
document.getElementById("settingsBtn").addEventListener("click", function(){
  playTap();
  switchView(currentView === "settings" ? "learn" : "settings");
});
document.getElementById("bgmBtn").addEventListener("click", function(){
  if(settings.bgm){ stopBgm(); showToast("BGMをとめました"); }
  else { startBgm(); showToast("BGMをながします 🎵"); }
  if(currentView === "settings") renderSettings();
});
document.getElementById("resetBtn").addEventListener("click", function(){
  if(confirm("きろくをぜんぶリセットしますか？")){
    mastery = {};
    FAMILIES.forEach(function(f){ mastery[f.id] = {correct:0}; });
    mastery.beVerb = {rounds:0};
    mastery.arrange = {correct:0};
    mastery.graduated = false;
    saveMastery();
    renderPassport();
    showToast("きろくをリセットしました");
  }
});
document.addEventListener("click", unlockAudio, true);
document.addEventListener("touchstart", unlockAudio, true);

/* ============ INIT ============ */
applyTheme();
renderPassport();
renderLearn();
updateBgmButton();
switchView("learn");
ensureAudio();
setTimeout(function(){
  if(settings.bgm && actx && actx.state === "running"){ if(!bgmRunning) bgmStep(); }
  else if(settings.bgm){ showAudioHint(); }
}, 300);
setTimeout(function(){ showToast("今日もいっしょにがんばろう！✨"); }, 700);

})();
</script>
</body>
</html>
