<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Yuzu ことばナビ</title>
<style>
:root{--teal:#75c8c8;--deep:#237f82;--cream:#fffdf5;--yellow:#ffe89a;--coral:#e85b4f;--green:#43a66f;--ink:#294243;--purple:#8170c7;--blue:#4c98c5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(#e9f8f7,#fff9ea);color:var(--ink);min-height:100vh}header{background:#bce6e3;border-bottom:5px solid var(--teal);padding:18px 14px;text-align:center;position:sticky;top:0;z-index:5}header h1{margin:0;color:#bd443a;font-size:1.45rem}header p{margin:4px 0 0;font-size:.8rem;color:#477575}#app{max-width:640px;margin:auto;padding:15px}.card{background:var(--cream);border:2px solid #eee6c9;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 5px 0 rgba(0,0,0,.07)}h2{font-size:1.1rem;color:#bd443a;border-left:6px solid var(--coral);padding-left:9px;margin:0 0 14px}.menu{display:grid;grid-template-columns:1fr 1fr;gap:11px}.menu button,.btn{border:0;border-radius:16px;padding:16px 10px;color:white;font:inherit;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.14);cursor:pointer}.menu button:active,.btn:active{transform:translateY(2px);box-shadow:none}.menu .wide{grid-column:1/-1}.pink{background:#d95d82}.purple{background:var(--purple)}.teal{background:var(--deep)}.blue{background:var(--blue)}.orange{background:#df9f38}.green{background:#568d5a}.back{border:2px solid var(--teal);background:white;color:var(--deep);border-radius:20px;padding:7px 14px;font-weight:700;margin-bottom:12px}.progress{height:8px;background:#eee;border-radius:10px;overflow:hidden;margin-bottom:14px}.progress div{height:100%;background:var(--teal)}.tag{display:inline-block;background:var(--yellow);color:#a94438;border-radius:15px;padding:4px 10px;font-size:.78rem;font-weight:700}.q{text-align:center;font-size:1.55rem;font-weight:800;margin:18px 0 5px}.sub{text-align:center;font-size:.82rem;color:#777;margin-bottom:16px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{background:white;border:2px solid var(--teal);border-radius:15px;padding:17px 8px;font-size:1.1rem;font-weight:800;color:var(--ink)}.choice.correct{background:#dff7e7;border-color:var(--green);color:#267348}.choice.wrong{background:#fde1de;border-color:var(--coral);color:#a7352d}.choice.lock{pointer-events:none}.feedback{text-align:center;font-weight:800;min-height:26px;margin-top:13px}.ok{color:#267348}.no{color:#b73f35}.next{display:none;width:100%;margin-top:12px;background:var(--deep);font-size:1rem}.next.show{display:block}.bigcard{border:3px solid var(--teal);border-radius:20px;background:linear-gradient(145deg,#fff,#effbfa);padding:28px 16px;text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center}.big{font-size:2.5rem;font-weight:900;color:var(--deep)}.answer{font-size:2rem;font-weight:900;color:var(--coral);margin-top:14px}.hint{font-size:.82rem;color:#888;margin-top:15px}.row{display:flex;gap:10px;margin-top:12px}.row .btn{flex:1}.score{text-align:center;font-size:2.6rem;font-weight:900;color:#bd443a;margin:10px}.note{background:#fff1b9;border-radius:12px;padding:10px;text-align:center;font-size:.9rem;margin-top:12px;font-weight:700}.mini-list{display:grid;gap:7px}.mini{display:flex;justify-content:space-between;background:white;border-radius:10px;padding:10px;border-left:5px solid var(--teal)}table{width:100%;border-collapse:collapse;font-size:.8rem}th,td{border:1px solid #e7dca7;padding:7px;text-align:center}th{background:var(--yellow)}td:first-child{background:#d9f0ed;font-weight:700}.poss{font-weight:900;color:var(--deep);font-size:1rem}
</style>
</head>
<body>
<header><h1>🌱 Yuzu ことばナビ</h1><p>むずかしい名前より、ことばを見て覚えよう</p></header>
<div id="app"></div>
<script>
const poss=[
 {jp:'私の',en:'my',base:'私'}, {jp:'あなたの',en:'your',base:'あなた'}, {jp:'彼の',en:'his',base:'彼'}, {jp:'彼女の',en:'her',base:'彼女'},
 {jp:'それの',en:'its',base:'それ'}, {jp:'私たちの',en:'our',base:'私たち'}, {jp:'あなたたちの',en:'your',base:'あなたたち'}, {jp:'彼らの',en:'their',base:'彼ら'}
];
const be=[
 {s:'I',jp:'私は',a:'am',note:'I のときは am'}, {s:'You',jp:'あなたは',a:'are',note:'You のときは are'}, {s:'He',jp:'彼は',a:'is',note:'He は1人なので is'}, {s:'She',jp:'彼女は',a:'is',note:'She は1人なので is'},
 {s:'It',jp:'それは',a:'is',note:'It は1つなので is'}, {s:'We',jp:'私たちは',a:'are',note:'We は are'}, {s:'They',jp:'彼らは',a:'are',note:'They は are'},
 {s:'Taro',jp:'タロウは',a:'is',note:'Taro → He と考える'}, {s:'My mother',jp:'私の母は',a:'is',note:'My mother → She と考える'}, {s:'These books',jp:'これらの本は',a:'are',note:'2つ以上なので are'}
];
const contractions=[
 {q:'I am',a:"I'm"},{q:'You are',a:"You're"},{q:'He is',a:"He's"},{q:'She is',a:"She's"},{q:'It is',a:"It's"},{q:'We are',a:"We're"},{q:'They are',a:"They're"}
];
let state={screen:'home'};
const app=document.getElementById('app');
function shuf(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){app.innerHTML='';screens[state.screen]();scrollTo(0,0)}
function home(){state={screen:'home'};render()}
function start(mode){
 if(mode==='learn'){state={screen:'learn',i:0,reveal:false};render();return}
 if(mode==='jp'){state={screen:'jp',list:shuf(poss),i:0,score:0,answered:false};render();return}
 if(mode==='en'){state={screen:'en',list:shuf(poss),i:0,score:0,answered:false};render();return}
 if(mode==='be'){state={screen:'be',list:shuf(be).slice(0,8),i:0,score:0,answered:false};render();return}
 if(mode==='short'){state={screen:'short',list:shuf(contractions),i:0,score:0,answered:false};render();return}
 state={screen:mode};render();
}
const screens={};
screens.home=()=>{app.innerHTML=`<div class="card"><h2>モードをえらぼう</h2><div class="menu">
<button class="pink" data-m="learn">🃏<br>レベル1<br>「〜の」を覚える</button>
<button class="purple" data-m="jp">🇯🇵→🇬🇧<br>レベル2<br>日本語から選ぶ</button>
<button class="orange" data-m="en">🇬🇧→🇯🇵<br>レベル3<br>英語から選ぶ</button>
<button class="teal" data-m="be">🔗<br>be動詞クイズ</button>
<button class="blue" data-m="short">✂️<br>短縮形クイズ</button>
<button class="green wide" data-m="table">📋<br>「〜の」早見表</button>
</div></div><div class="card"><div class="note">レベル2・3は、答えたあとに正解が出ます。<br>「次の問題」を押すまで答えは消えません。</div></div>`;app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>start(b.dataset.m))};

screens.learn=()=>{const x=poss[state.i];app.innerHTML=`<button class="back" id="back">← もどる</button><div class="card"><div class="tag">${state.i+1} / ${poss.length}</div><div class="bigcard" id="card"><div class="big">${x.jp}</div>${state.reveal?`<div class="answer">${x.en}</div><div class="hint">${x.base} + の → ${x.en}</div>`:`<div class="answer" style="color:#ccc">?</div><div class="hint">タップして答えを見る 👆</div>`}</div><div class="row"><button class="btn teal" id="prev">← まえ</button><button class="btn pink" id="next">つぎ →</button></div></div>`;back.onclick=home;card.onclick=()=>{state.reveal=!state.reveal;render()};prev.onclick=()=>{state.i=(state.i-1+poss.length)%poss.length;state.reveal=false;render()};next.onclick=()=>{state.i=(state.i+1)%poss.length;state.reveal=false;render()}};

function possQuiz(mode){
 const s=state,x=s.list[s.i],jpMode=mode==='jp';
 const correct=jpMode?x.en:x.jp;
 const pool=[...new Set(poss.map(v=>jpMode?v.en:v.jp))].filter(v=>v!==correct);
 const choices=shuf([correct,...shuf(pool).slice(0,3)]);
 app.innerHTML=`<button class="back" id="back">← もどる</button><div class="card"><div class="progress"><div style="width:${s.i/s.list.length*100}%"></div></div><div style="text-align:center"><span class="tag">レベル${jpMode?2:3}　${s.i+1}/${s.list.length}　スコア ${s.score}</span></div><div class="q">${jpMode?x.jp:x.en}</div><div class="sub">${jpMode?'英語はどれ？':'日本語はどれ？'}</div><div class="choices" id="choices">${choices.map(c=>`<button class="choice" data-v="${c}">${c}</button>`).join('')}</div><div class="feedback" id="fb"></div><button class="btn next" id="nextQ">次の問題 →</button></div>`;
 back.onclick=home;
 document.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{
   if(s.answered)return;s.answered=true;const ok=btn.dataset.v===correct;if(ok)s.score++;
   document.querySelectorAll('.choice').forEach(b=>{b.classList.add('lock');if(b.dataset.v===correct)b.classList.add('correct');if(b===btn&&!ok)b.classList.add('wrong')});
   fb.className='feedback '+(ok?'ok':'no');fb.innerHTML=ok?`せいかい！ 🎉<br><b>${x.jp} ＝ ${x.en}</b>`:`正解は <b>「${correct}」</b><br>${x.jp} ＝ ${x.en}`;
   nextQ.classList.add('show');
 });
 nextQ.onclick=()=>{s.i++;s.answered=false;if(s.i>=s.list.length){state={screen:'result',mode,score:s.score,total:s.list.length};render()}else render()};
}
screens.jp=()=>possQuiz('jp');screens.en=()=>possQuiz('en');

screens.be=()=>{const s=state,x=s.list[s.i],choices=shuf(['am','are','is']);app.innerHTML=`<button class="back" id="back">← もどる</button><div class="card"><div class="progress"><div style="width:${s.i/s.list.length*100}%"></div></div><div style="text-align:center"><span class="tag">${s.i+1}/${s.list.length}　スコア ${s.score}</span></div><div class="q">${x.s}</div><div class="sub">${x.jp}　に合う be動詞は？</div><div class="choices" id="choices">${choices.map(c=>`<button class="choice" data-v="${c}">${c}</button>`).join('')}</div><div class="feedback" id="fb"></div><div id="note"></div><button class="btn next" id="nextQ">次の問題 →</button></div>`;back.onclick=home;document.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{if(s.answered)return;s.answered=true;const ok=btn.dataset.v===x.a;if(ok)s.score++;document.querySelectorAll('.choice').forEach(b=>{b.classList.add('lock');if(b.dataset.v===x.a)b.classList.add('correct');if(b===btn&&!ok)b.classList.add('wrong')});fb.className='feedback '+(ok?'ok':'no');fb.innerHTML=ok?`せいかい！ <b>${x.s} ${x.a}</b> 🎉`:`正解は <b>${x.a}</b> → ${x.s} ${x.a}`;note.innerHTML=`<div class="note">${x.note}</div>`;nextQ.classList.add('show')});nextQ.onclick=()=>{s.i++;s.answered=false;if(s.i>=s.list.length){state={screen:'result',mode:'be',score:s.score,total:s.list.length};render()}else render()}};

screens.short=()=>{const s=state,x=s.list[s.i];const pool=contractions.map(v=>v.a).filter(v=>v!==x.a);const choices=shuf([x.a,...shuf(pool).slice(0,3)]);app.innerHTML=`<button class="back" id="back">← もどる</button><div class="card"><div class="progress"><div style="width:${s.i/s.list.length*100}%"></div></div><div style="text-align:center"><span class="tag">${s.i+1}/${s.list.length}　スコア ${s.score}</span></div><div class="q">${x.q}</div><div class="sub">短くするとどれ？</div><div class="choices">${choices.map(c=>`<button class="choice" data-v="${c}">${c}</button>`).join('')}</div><div class="feedback" id="fb"></div><button class="btn next" id="nextQ">次の問題 →</button></div>`;back.onclick=home;document.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{if(s.answered)return;s.answered=true;const ok=btn.dataset.v===x.a;if(ok)s.score++;document.querySelectorAll('.choice').forEach(b=>{b.classList.add('lock');if(b.dataset.v===x.a)b.classList.add('correct');if(b===btn&&!ok)b.classList.add('wrong')});fb.className='feedback '+(ok?'ok':'no');fb.innerHTML=ok?`せいかい！ 🎉<br>${x.q} → <b>${x.a}</b>`:`正解は <b>${x.a}</b>`;nextQ.classList.add('show')});nextQ.onclick=()=>{s.i++;s.answered=false;if(s.i>=s.list.length){state={screen:'result',mode:'short',score:s.score,total:s.list.length};render()}else render()}};

screens.table=()=>{app.innerHTML=`<button class="back" id="back">← もどる</button><div class="card"><h2>「〜の」だけ覚えよう</h2><table><thead><tr><th>日本語</th><th>英語</th></tr></thead><tbody>${poss.map(x=>`<tr><td>${x.jp}</td><td class="poss">${x.en}</td></tr>`).join('')}</tbody></table><div class="note">むずかしい「所有格」という名前は、今は覚えなくてOK。<br>まず「私の＝my」のようにセットで覚えよう。</div></div>`;back.onclick=home};

screens.result=()=>{const s=state;app.innerHTML=`<div class="card"><h2 style="text-align:center;border:0">けっか</h2><div class="score">${s.score} / ${s.total}</div><div class="sub">${s.score===s.total?'パーフェクト！ 🏆':'答えを1つずつ見ながら、もう一度やってみよう！'}</div><div class="row"><button class="btn pink" id="retry">もう一度</button><button class="btn teal" id="home">ホームへ</button></div></div>`;retry.onclick=()=>start(s.mode);home.onclick=()=>home()};
render();
</script>
</body>
</html>
