<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Yuzu 英語ステップ</title><style>:root{--t:#75c8c8;--d:#237f82;--c:#fffdf5;--y:#ffe89a;--r:#e85b4f;--g:#43a66f;--i:#294243}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(#e9f8f7,#fff9ea);color:var(--i)}header{background:#bce6e3;border-bottom:5px solid var(--t);padding:16px;text-align:center;position:sticky;top:0;z-index:20}h1{font-size:1.35rem;margin:0;color:#bd443a}header p{margin:4px 0 0;font-size:.78rem}#app{max-width:720px;margin:auto;padding:14px}.card{background:var(--c);border:2px solid #eee6c9;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 5px 0 #0001}h2{font-size:1.08rem;color:#bd443a;border-left:6px solid var(--r);padding-left:9px}.menu{display:grid;grid-template-columns:1fr 1fr;gap:11px}.menu button,.btn{border:0;border-radius:16px;padding:16px 10px;color:#fff;font:inherit;font-weight:800;box-shadow:0 4px 0 #0002}.wide{grid-column:1/-1}.pink{background:#d95d82}.purple{background:#8170c7}.orange{background:#df9f38}.blue{background:#4c98c5}.teal{background:var(--d)}.green{background:#568d5a}.gray{background:#777}.back{border:2px solid var(--t);background:#fff;color:var(--d);border-radius:20px;padding:7px 14px;font-weight:800;margin-bottom:12px}.progress{height:12px;background:#e8e8e8;border-radius:10px;overflow:hidden}.progress div{height:100%;background:var(--g)}.pl{display:flex;justify-content:space-between;font-size:.8rem;font-weight:800;margin:6px 0 12px}.tag{display:inline-block;background:var(--y);color:#a94438;border-radius:15px;padding:4px 10px;font-size:.78rem;font-weight:800}.q{text-align:center;font-size:1.45rem;font-weight:900;margin:18px 0 7px;line-height:1.5}.sub{text-align:center;font-size:.82rem;color:#777;margin-bottom:16px}.choices{display:grid;gri er}.timer b{font-size:2rem}.timer.warn{border-color:var(--r);color:var(--r)}.start{text-align:center;padding:26px}.start button{width:100%;background:var(--r);color:#fff;border:0;border-radius:22px;padding:18px;font:inherit;font-size:1.2rem;font-weight:900}.setting{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid #eee}.toggle{width:58px;height:32px;border:0;border-radius:20px;background:#bbb;position:relative}.toggle:after{content:"";position:absolute;width:26px;height:26px;left:3px;top:3px;border-radius:50%;background:white;transition:.2s}.toggle.on{background:var(--g)}.toggle.on:after{left:29px}.small{font-size:.76rem;color:#777}</style></head><body><header><h1>🌱 Yuzu 英語ステップ</h1><p>正解を積み上げて、レベルアップ！</p></header><div id="app"></div><script>const A=document.getElementById('app'),K='yuzuEnglishStep_v5';let D;try{D=JSON.parse(localStorage.getItem(K))||{}}catch(e){D={}}D.levels??={};D.table??={bestScore:0,bestTime:null,plays:0};D.table.top5??=[];D.settings??={jp:true,bgm:true,se:true};const save=()=>localStorage.setItem(K,JSON.stringify(D)),sh=a=>[...a].sort(()=>Math.random()-.5);let S={screen:'home'},ctx=null,bgm=null,bs=0;function audio(){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}}function tone(f,d=.12,v=.04,t='sine'){if(!D.settings.se)return;audio();if(!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}const okS=()=>{tone(660,.08);setTimeout(()=>tone(880,.13),70)},ngS=()=>tone(190,.18,.035,'triangle'),tap=()=>tone(520,.045,.016);function bnote(f){audio();if(!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.01,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.4);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.4)}function syncB(){if(!D.settings.bgm){clearInterval(bgm);bgm=null;return}if(bgm)return;audio();let n=[262,330,392,330,294,349,440,349];bnote(n[bs++%n.length]);bgm=setInterval(()=>bnote(n[bs++%n.length]),500)}const Q={1:[['___ am Yuzu.','私はゆずです。','I',['I','My','Me','Mine']],['This is ___ book.','これは私の本です。','my',['I','my','me','mine']],['She likes ___.','彼女は私のことが好きです。','me',['I','my','me','mine']],['This book is ___.','この本は私のものです。','mine',['I','my','me','mine']],['___ is my brother.','彼は私の兄です。','He',['He','His','Him','They']],['This is ___ bag.','これは彼女のかばんです。','her',['she','her','hers','him']],['I know ___.','私は彼を知っています。','him',['he','his','him','her']],['___ are my friends.','彼らは私の友だちです。','They',['They','Their','Them','We']],['This is ___ house.','これは私たちの家です。','our',['we','our','us','ours']],['She helps ___.','彼女は私たちを助けます。','us',['we','our','us','ours']]],2:[['I ___ a student.','私は生徒です。','am',['am','are','is','be']],['You ___ kind.','あなたは親切です。','are',['am','are','is','be']],['He ___ busy.','彼は忙しいです。','is',['am','are','is','be']],['She ___ happy.','彼女は幸せです。','is',['am','are','is','be']],['We ___ friends.','私たちは友だちです。','are',['am','are','is','be']],['They ___ here.','彼らはここにいます。','are',['am','are','is','be']],['Taro ___ a boy.','タロウは男の子です。','is',['am','are','is','be']],['These books ___ new.','これらの本は新しいです。','are',['am','are','is','be']]],3:[['I ___ soccer.','私はサッカーをします。','play',['play','plays','am','do']],['We ___ English.','私たちは英語を勉強します。','study',['study','studies','are','studying']],['They ___ dogs.','彼らは犬が好きです。','like',['like','likes','is','liked']],['You ___ TV.','あなたはテレビを見ます。','watch',['watch','watches','are','see']],['I ___ breakfast.','私は朝ごはんを食べます。','eat',['eat','eats','am','ate']],['We ___ to school.','私たちは学校へ行きます。','go',['go','goes','are','went']],['They ___ books.','彼らは本を読みます。','read',['read','reads','are','reading']],['You ___ music.','あなたは音楽を聞きます。','listen to',['listen to','listens to','are','hear']]],4:[['___ you a student?','あなたは生徒ですか？','Are',['Are','Is','Do','Does'],'Yes, I am.'],['___ he busy?','彼は忙しいですか？','Is',['Are','Is','Do','Does'],'Yes, he is.'],['___ you like soccer?','あなたはサッカーが好きですか？','Do',['Are','Is','Do','Does'],'Yes, I do.'],['___ she play tennis?','彼女はテニスをしますか？','Does',['Are','Is','Do','Does'],'Yes, she does.'],['Are they friends?','彼らは友だちですか？','Yes, they are.',['Yes, they are.','Yes, they do.','Yes, they is.','Yes, they does.']],['Do you study English?','あなたは英語を勉強しますか？','Yes, I do.',['Yes, I do.','Yes, I am.','Yes, I does.','Yes, I is.']],['Does he like dogs?','彼は犬が好きですか？','Yes, he does.',['Yes, he does.','Yes, he is.','Yes, he do.','Yes, he are.']]],5:[['He ___ soccer.','彼はサッカーをします。','plays',['play','plays','playes','playing'],'he なので play → plays'],['She ___ English.','彼女は英語を勉強します。','studies',['study','studys','studies','studying'],'study → studies'],['Taro ___ TV.','タロウはテレビを見ます。','watches',['watch','watchs','watches','watchies'],'watch → watches'],['He ___ to school.','彼は学校へ行きます。','goes',['go','gos','goes','going'],'go → goes'],['She ___ lunch.','彼女は昼ごはんを食べます。','eats',['eat','eats','eates','eating'],'eat → eats'],['My mother ___ books.','母は本を読みます。','reads',['read','reads','reades','reading'],'1人なので read → reads'],['Ken ___ music.','ケンは音楽を聞きます。','listens to',['listen to','listens to','listen tos','listening'],'Ken = he と考える']]};const R=[['私','I','my','me','mine','am'],['あなた','you','your','you','yours','are'],['彼','he','his','him','his','is'],['彼女','she','her','her','hers','is'],['それ','it','its','it','—','is'],['私たち','we','our','us','ours','are'],['あなたたち','you','your','you','yours','are'],['彼ら','they','their','them','theirs','are']],C=['subj','poss','obj','possp','be'];function prog(s,t,l='正解した数'){return `<div class="progress"><div style="width:${t?s/t*100:0}%"></div></div><div class="pl"><span>${l}</span><span>${s} / ${t}</span></div>`}function top5Html(){let a=D.table.top5||[];if(!a.length)return '<div class="record">まだ満点記録はありません</div>';return a.map((r,i)=>`<div class="rank"><b>${i+1}位</b><span>${Number(r.time).toFixed(1)}秒${r.date?`　<span class="small">${r.date}</span>`:''}</span></div>`).join('')}function render(){A.innerHTML='';screens[S.screen]();scrollTo(0,0)}function home(){if(S.timer)clearInterval(S.timer);S={screen:'home'};render()}function start(n){audio();syncB();S={screen:'quiz',level:n,list:sh(Q[n]),i:0,score:0,answered:false};render()}const screens={};screens.home=()=>{A.innerHTML=`<div class="card"><h2>レベルをえらぼう</h2><div class="menu"><button class="pink" data-l="1">1️⃣<br>レベル1<br>代名詞の文章穴埋め</button><button class="purple" data-l="2">2️⃣<br>レベル2<br>be動詞</button><button class="orange" data-l="3">3️⃣<br>レベル3<br>一般動詞</button><button class="blue" data-l="4">4️⃣<br>レベル4<br>疑問文と答え</button><button class="teal wide" data-l="5">5️⃣<br>レベル5<br>動詞に s をつける</button><button class="green wide" id="tableBtn">⏱️📋<br>代名詞＋be動詞 早見表・タイムアタック</button><button class="gray wide" id="setBtn">⚙️<br>設定</button></div></div><div class="card"><h2>これまでの進みぐあい</h2>${[1,2,3,4,5].map(n=>`<div class="record">レベル${n} ${prog(D.levels[n]?.best||0,Q[n].length,'最高正解数')}</div>`).join('')}<h2>🏆 早見表 満点トップ5</h2>${top5Html()}</div>`;A.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>start(+b.dataset.l));document.getElementById('tableBtn').onclick=()=>{tap();build();render()};document.getElementById('setBtn').onclick=()=>{tap();S.screen='settings';render()}};screens.quiz=()=>{let x=S.list[S.i],ch=sh(x[3]);A.innerHTML=`<button class="back" id="back">← もどる</button><div class="card">${prog(S.score,S.list.length)}<div style="text-align:center"><span class="tag">レベル${S.level}　問題 ${S.i+1}/${S.list.length}</span></div><div class="q">${x[0]}</div>${D.settings.jp?`<div class="sub">${x[1]}</div>`:'<div class="sub">日本語訳：OFF</div>'}<div class="choices">${ch.map(c=>`<button class="choice" data-v="${c}">${c}</button>`).join('')}</div><div id="fb" class="feedback"></div><div id="extra"></div><button id="next" class="btn next">次の問題 →</button></div>`;document.getElementById('back').onclick=home;A.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(S.answered)return;S.answered=true;let o=b.dataset.v===x[2];o?(S.score++,okS()):ngS();A.querySelectorAll('.choice').forEach(z=>{z.classList.add('lock');if(z.dataset.v===x[2])z.classList.add('correct');if(z===b&&!o)z.classList.add('wrong')});document.getElementById('fb').innerHTML=o?`せいかい！ 🎉<br><b>${x[0].replace('___',x[2])}</b>`:`正解は <b>「${x[2]}」</b><br>${x[0].replace('___',x[2])}`;if(x[4])document.getElementById('extra').innerHTML=`<div class="note">${S.level===4?'答え方：':''}${x[4]}</div>`;document.getElementById('next').classList.add('show')});document.getElementById('next').onclick=()=>{tap();S.i++;S.answered=false;if(S.i>=S.list.length){let old=D.levels[S.level]?.best||0,n=S.score>old;if(n){D.levels[S.level]={best:S.score};save()}S={screen:'result',level:S.level,score:S.score,total:S.list.length,newBest:n};render()}else render()}};screens.result=()=>{A.innerHTML=`<div class="card"><h2>レベル${S.level} けっか</h2>${prog(S.score,S.total)}<div class="score">${S.score} / ${S.total}</div>${S.newBest?'<div class="newbest">🎉 さいこうきろく！<br>すごい！前よりできるようになったね！ 🏆</div>':''}<div class="row"><button id="again" class="btn pink">もう一度</button><button id="homeBtn" class="btn teal">ホーム</button></div></div>`;document.getElementById('again').onclick=()=>start(S.level);document.getElementById('homeBtn').onclick=home};screens.settings=()=>{A.innerHTML=`<button class="back" id="back">← もどる</button><div class="card"><h2>⚙️ 設定</h2>${[['jp','🇯🇵 日本語訳','レベル1〜5の問題の下に日本語を表示'],['bgm','🎵 BGM','勉強中に小さなBGMを流す'],['se','🔊 SE（効果音）','正解・不正解・タップ音']].map(x=>`<div class="setting"><div><b>${x[1]}</b><div class="small">${x[2]}</div></div><button class="toggle ${D.settings[x[0]]?'on':''}" data-k="${x[0]}"></button></div>`).join('')}<div class="small" style="text-align:center;margin-top:12px">設定はこの端末に保存されます</div></div>`;document.getElementById('back').onclick=home;A.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{audio();let k=b.dataset.k;D.settings[k]=!D.settings[k];save();if(k==='bgm')syncB();if(k==='se'&&D.settings.se)okS();render()})};function build(){if(S.timer)clearInterval(S.timer);let keys=[];R.forEach((r,i)=>C.forEach((c,j)=>{if(r[j+1]!=='—'&&Math.random()<.45)keys.push(i+'_'+j)}));R.forEach((r,i)=>{if(!keys.some(k=>k.startsWith(i+'_'))){let j=Math.floor(Math.random()*5);while(r[j+1]==='—')j=Math.floor(Math.random()*5);keys.push(i+'_'+j)}});S={screen:'table',started:false,graded:false,left:60,fill:{},keys,bank:sh(keys.map((k,id)=>{let [i,j]=k.split('_').map(Number);return{id,w:R[i][j+1],used:null}})),active:keys[0],newBest:false,perfectSaved:false}}function cell(i,j){let k=i+'_'+j,v=R[i][j+1];if(v==='—')return '—';if(!S.keys.includes(k))return v;let id=S.fill[k],it=S.bank.find(x=>x.id===id),cl='blank'+(S.active===k&&!S.graded?' active':'');if(S.graded)cl+=it&&it.w===v?' ok':' ng';return `<button class="${cl}" data-k="${k}">${it?it.w:'？'}</button>${S.graded&&(!it||it.w!==v)?`<div class="small">正解 ${v}</div>`:''}`}function tscore(){let n=0;S.keys.forEach(k=>{let [i,j]=k.split('_').map(Number),it=S.bank.find(x=>x.id===S.fill[k]);if(it&&it.w===R[i][j+1])n++});return n}function tick(){S.left=Math.max(0,(S.end-Date.now())/1000);let e=document.getElementById('time');if(e)e.textContent=Math.ceil(S.left)+'秒';if(S.left<=0){clearInterval(S.timer);finishTable(true)}}function finishTable(up=false){if(S.graded||!S.started)return;clearInterval(S.timer);S.graded=true;S.used=up?60:Math.max(0,60-S.left);let sc=tscore();D.table.plays=(D.table.plays||0)+1;if(sc===S.keys.length){let rec={time:+S.used.toFixed(1),date:new Date().toLocaleDateString('ja-JP')};D.table.top5=[...(D.table.top5||[]),rec].sort((a,b)=>a.time-b.time).slice(0,5);S.perfectSaved=true;S.newBest=D.table.top5[0]===rec;D.table.bestScore=sc;D.table.bestTime=D.table.top5[0]?.time??S.used;okS()}else ngS();save();render()}screens.table=()=>{if(!S.started&&!S.graded){A.innerHTML=`<button class="back" id="back">← もどる</button><div class="card start"><h2>代名詞＋be動詞 早見表</h2><h2>🏆 満点トップ5</h2>${top5Html()}<p>制限時間60秒。スタートを押すまで問題は表示されません。</p><button id="go">スタート！</button></div>`;document.getElementById('back').onclick=home;document.getElementById('go').onclick=()=>{audio();syncB();tap();S.started=true;S.end=Date.now()+60000;render();S.timer=setInterval(tick,100)};return}let sc=S.graded?tscore():0;A.innerHTML=`<button class="back" id="back">← もどる</button><div class="timer ${S.left<=10?'warn':''}"><span>⏱ のこり時間</span><b id="time">${Math.ceil(S.left)}秒</b></div><div class="card"><h2>代名詞＋be動詞 早見表</h2><div style="overflow-x:auto"><table><tr><th>日本語</th><th>〜は/が</th><th>〜の</th><th>〜を/に</th><th>〜のもの</th><th>be動詞</th></tr>${R.map((r,i)=>`<tr><td>${r[0]}</td>${[0,1,2,3,4].map(j=>`<td>${cell(i,j)}</td>`).join('')}</tr>`).join('')}</table></div>${S.graded?prog(sc,S.keys.length,'正解数'):''}<div>${S.graded?'':S.bank.map(x=>`<button class="word ${x.used!=null?'used':''}" data-id="${x.id}">${x.w}</button>`).join('')}</div>${S.graded?`<div class="feedback">${sc} / ${S.keys.length} 正解！ ${S.used.toFixed(1)}秒</div>${S.perfectSaved?'<div class="newbest">🎉 満点！ 記録を保存しました！</div>':'<div class="note">満点のときだけトップ5記録に保存されます。</div>'}<h2>🏆 満点トップ5</h2>${top5Html()}<div class="row"><button id="retry" class="btn pink">もう一度</button><button id="hh" class="btn teal">ホーム</button></div>`:`<div class="row"><button id="finishBtn" class="btn teal">終わり</button><button id="retry" class="btn pink">やり直す</button></div>`}</div>`;document.getElementById('back').onclick=home;if(S.graded){document.getElementById('retry').onclick=()=>{build();render()};document.getElementById('hh').onclick=home;return}A.querySelectorAll('.blank').forEach(b=>b.onclick=()=>{let k=b.dataset.k;if(S.fill[k]!=null){let it=S.bank.find(x=>x.id===S.fill[k]);it.used=null;delete S.fill[k]}S.active=k;render()});A.querySelectorAll('.word').forEach(b=>b.onclick=()=>{let it=S.bank.find(x=>x.id===+b.dataset.id);if(it.used!=null){delete S.fill[it.used];it.used=null;render();return}let k=S.active;if(!k||S.fill[k]!=null)k=S.keys.find(x=>S.fill[x]==null);if(!k)return;S.fill[k]=it.id;it.used=k;S.active=S.keys.find(x=>S.fill[x]==null)||null;render()});document.getElementById('finishBtn').onclick=()=>finishTable(false);document.getElementById('retry').onclick=()=>{build();render()}};render();</script></body></html>
