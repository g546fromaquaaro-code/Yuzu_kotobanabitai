<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人称代名詞 & be動詞マスター</title>
<style>
  :root{
    --teal:#a9dcdc;
    --teal-dark:#5fb3b3;
    --teal-deep:#2e8b8b;
    --cream:#fffdf5;
    --yellow:#fdeca0;
    --coral:#e0574a;
    --coral-dark:#c1392c;
    --ink:#2c3e3e;
    --green:#4caf7d;
    --red:#e0574a;
    --shadow: 0 4px 0 rgba(0,0,0,0.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family: "Hiragino Maru Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background: linear-gradient(180deg,#eaf7f6 0%, #fdf9ec 100%);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    background:var(--teal);
    padding:18px 16px 22px;
    text-align:center;
    border-bottom:5px solid var(--teal-dark);
    position:sticky; top:0; z-index:5;
  }
  header h1{
    margin:0;
    font-size:1.5rem;
    color:var(--coral-dark);
    letter-spacing:1px;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
  }
  header p{margin:4px 0 0; font-size:0.78rem; color:#2e6a6a;}
  #app{max-width:640px; margin:0 auto; padding:16px;}

  .card{
    background:var(--cream);
    border-radius:18px;
    padding:16px;
    margin-bottom:14px;
    box-shadow: var(--shadow);
    border:2px solid #f0e9d0;
  }
  .menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .menu-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
    padding:18px 8px;
    border-radius:16px;
    border:none;
    cursor:pointer;
    font-size:0.95rem;
    font-weight:bold;
    color:white;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    transition: transform .08s;
  }
  .menu-btn:active{transform: translateY(3px); box-shadow:none;}
  .menu-btn .emoji{font-size:1.8rem;}
  .btn1{background:var(--teal-deep);}
  .btn2{background:var(--coral);}
  .btn3{background:#e2a53d;}
  .btn4{background:#7d6bb0;}
  .btn5{background:#d1567f;}
  .btn6{background:#3d8ab5;}
  .btn-wide{grid-column: span 2; background:#5b8c5a;}

  .stat-row{display:flex; justify-content:space-between; font-size:0.82rem; color:#555; margin-top:4px;}

  .back-btn{
    background:none; border:2px solid var(--teal-dark); color:var(--teal-deep);
    border-radius:20px; padding:6px 14px; font-size:0.85rem; font-weight:bold; margin-bottom:12px;
  }

  h2.section-title{
    color:var(--coral-dark); font-size:1.15rem; margin:0 0 10px; border-left:6px solid var(--coral);
    padding-left:8px;
  }
  h3.sub-title{color:var(--teal-deep); font-size:1rem; margin:16px 0 8px;}

  table.pronoun-table{
    width:100%; border-collapse:collapse; font-size:0.72rem; background:white; border-radius:10px; overflow:hidden;
  }
  table.pronoun-table th, table.pronoun-table td{
    border:1px solid #e6d98c; padding:5px 3px; text-align:center; vertical-align:middle;
  }
  table.pronoun-table th{background:var(--yellow); color:var(--coral-dark); font-size:0.68rem;}
  table.pronoun-table td.label-cell{background:var(--teal); font-weight:bold; color:var(--coral-dark);}
  table.pronoun-table td.num-cell{background:#f5f5f5; font-weight:bold; color:#555;}
  table.pronoun-table input{
    width:100%; border:none; background:transparent; text-align:center; font-size:0.78rem;
    font-family:inherit; padding:4px 0; border-radius:4px;
  }
  table.pronoun-table input:focus{background:#eafff5; outline:2px solid var(--teal-dark);}
  table.pronoun-table input.correct{background:#dff7e6; color:#2b7a4b; font-weight:bold;}
  table.pronoun-table input.wrong{background:#fde3e0; color:#c1392c; font-weight:bold;}
  .answer-shown{display:block; font-size:0.62rem; color:#c1392c; margin-top:2px;}

  .cell-btn{
    width:100%; min-width:54px; border:2px dashed var(--teal-dark); background:#f2fbfa;
    border-radius:8px; padding:7px 2px; font-family:inherit; font-size:0.8rem; font-weight:bold;
    color:#8fb0b0; cursor:pointer;
  }
  .cell-btn.filled{border-style:solid; background:white; color:var(--ink);}
  .cell-btn.active{outline:3px solid var(--coral); outline-offset:1px; background:#fff6f5;}
  .cell-btn.ok{background:#dff7e6; border-color:var(--green); border-style:solid; color:#2b7a4b;}
  .cell-btn.ng{background:#fde3e0; border-color:var(--red); border-style:solid; color:#c1392c;}

  .bank-panel{
    position:sticky; bottom:0; background:var(--cream); padding:10px 0 4px;
    border-top:2px dashed #e6d98c; margin-top:14px;
  }
  .bank-title{font-size:0.82rem; font-weight:bold; color:var(--coral-dark); margin:0 0 8px;}
  .bank{display:flex; flex-wrap:wrap; gap:8px;}
  .bank-btn{
    padding:9px 14px; border-radius:20px; border:2px solid var(--teal-deep); background:white;
    font-size:0.95rem; font-weight:bold; color:var(--teal-deep); font-family:inherit; cursor:pointer;
  }
  .bank-btn:active{background:#eafffb;}
  .bank-btn.used{opacity:0.28; border-style:dashed;}

  .action-row{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .pill-btn{
    flex:1; min-width:110px; padding:11px 8px; border-radius:24px; border:none; font-weight:bold;
    font-size:0.9rem; color:white; background:var(--teal-deep); cursor:pointer; box-shadow: var(--shadow);
  }
  .pill-btn.secondary{background:#999;}
  .pill-btn.coral{background:var(--coral);}
  .pill-btn:active{transform:translateY(2px); box-shadow:none;}

  .progress-bar{height:8px; background:#eee; border-radius:6px; overflow:hidden; margin-bottom:14px;}
  .progress-fill{height:100%; background:var(--teal-dark); transition:width .25s;}

  .question-box{text-align:center; padding:10px 0 18px;}
  .question-jp{font-size:1.15rem; font-weight:bold; color:var(--ink); margin-bottom:4px;}
  .question-tag{display:inline-block; background:var(--yellow); color:var(--coral-dark); font-size:0.75rem;
    padding:3px 10px; border-radius:12px; margin-bottom:10px; font-weight:bold;}
  .choice-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .choice-btn{
    padding:16px 8px; border-radius:14px; border:2px solid var(--teal-dark); background:white;
    font-size:1.05rem; font-weight:bold; color:var(--ink); cursor:pointer;
  }
  .choice-btn:active{background:#eafffb;}
  .choice-btn.correct{background:#dff7e6; border-color:var(--green); color:#2b7a4b;}
  .choice-btn.wrong{background:#fde3e0; border-color:var(--red); color:#c1392c;}
  .choice-btn.disabled{pointer-events:none; opacity:0.7;}

  .feedback{text-align:center; font-weight:bold; margin-top:12px; font-size:0.95rem; min-height:20px;}
  .feedback.ok{color:#2b7a4b;}
  .feedback.no{color:#c1392c;}

  .result-score{font-size:2.4rem; font-weight:bold; text-align:center; color:var(--coral-dark); margin:6px 0;}
  .result-sub{text-align:center; color:#555; margin-bottom:16px; font-size:0.9rem;}

  .pair-subject{
    font-size:2.2rem; font-weight:bold; text-align:center; color:var(--teal-deep); margin:10px 0 18px;
    background:var(--teal); border-radius:16px; padding:20px 0;
  }
  .beverb-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .beverb-grid .choice-btn{font-size:1.3rem;}

  .flash-card{
    background:linear-gradient(160deg,#ffffff,#f0fbfa);
    border:3px solid var(--teal-dark); border-radius:20px; padding:26px 16px;
    text-align:center; min-height:210px; display:flex; flex-direction:column; justify-content:center;
    cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,0.08);
  }
  .flash-subject{font-size:2.6rem; font-weight:bold; color:var(--teal-deep); line-height:1.1;}
  .flash-jp{font-size:0.9rem; color:#777; margin-top:6px;}
  .flash-q{font-size:2.6rem; color:#c9c9c9; font-weight:bold; margin-top:10px;}
  .flash-be{font-size:2.6rem; font-weight:bold; color:var(--coral); margin-top:10px;}
  .flash-sh{font-size:1rem; color:#5b8c5a; margin-top:8px; font-weight:bold;}
  .flash-ex{font-size:0.9rem; color:#444; margin-top:12px; background:white; border-radius:10px; padding:8px 10px;}
  .flash-hint{font-size:0.78rem; color:#999; margin-top:14px;}
  .flash-counter{text-align:center; font-size:0.82rem; color:#777; margin-bottom:8px;}
  .flash-list{display:grid; grid-template-columns:1fr; gap:6px; margin-top:14px;}
  .flash-row{display:flex; justify-content:space-between; background:white; border-radius:8px; padding:7px 12px; font-size:0.9rem; border-left:5px solid var(--teal-dark);}
  .flash-row b{color:var(--coral-dark);}

  .conv-note{
    background:var(--yellow); border-radius:10px; padding:8px 12px; font-size:0.85rem;
    color:var(--coral-dark); font-weight:bold; margin-top:10px; text-align:center;
  }

  .grammar-block{background:#f7fbfa; border-radius:12px; padding:12px 14px; margin-bottom:12px; font-size:0.88rem; line-height:1.7;}
  .grammar-block b{color:var(--coral-dark);}
  .example{background:white; border-left:4px solid var(--teal-dark); padding:6px 10px; margin:6px 0; font-size:0.85rem; border-radius:0 8px 8px 0;}
  .mnemonic{background:var(--yellow); border-radius:10px; padding:10px 12px; text-align:center; font-weight:bold; color:var(--coral-dark); font-size:0.95rem; margin:10px 0;}

  .timer-wrap{
    display:flex; align-items:center; gap:10px; background:white; border:2px solid var(--teal-dark);
    border-radius:14px; padding:8px 12px; margin-bottom:10px;
  }
  .timer-num{font-size:1.5rem; font-weight:bold; color:var(--teal-deep); min-width:70px; text-align:center; font-variant-numeric:tabular-nums;}
  .timer-track{flex:1; height:12px; background:#eee; border-radius:8px; overflow:hidden;}
  .timer-fill{height:100%; background:var(--teal-dark); width:100%; transition:width .9s linear;}
  .timer-wrap.warn{border-color:var(--coral); animation:pulse .6s infinite alternate;}
  .timer-wrap.warn .timer-num{color:var(--coral);}
  .timer-wrap.warn .timer-fill{background:var(--coral);}
  @keyframes pulse{ from{background:white;} to{background:#fff0ee;} }
  @media (prefers-reduced-motion: reduce){ .timer-wrap.warn{animation:none;} .timer-fill{transition:none;} }

  .start-overlay{
    position:fixed; inset:0; background:rgba(42,90,90,0.85); z-index:60;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;
  }
  .start-overlay h3{color:white; font-size:1.4rem; margin:0 0 6px;}
  .start-overlay p{color:#dff3f3; font-size:0.9rem; margin:0 0 22px; line-height:1.7;}
  .start-btn{
    background:var(--coral); color:white; border:none; border-radius:40px; padding:18px 46px;
    font-size:1.3rem; font-weight:bold; font-family:inherit; box-shadow:0 6px 0 rgba(0,0,0,0.2);
  }
  .start-btn:active{transform:translateY(3px); box-shadow:none;}
    position:fixed; inset:0; background:rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .modal-box{background:white; border-radius:16px; padding:20px; max-width:320px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,0.2);}
  .modal-box p{font-size:0.95rem; margin:8px 0 16px;}
  .hidden{display:none;}
</style>
</head>
<body>
<header>
  <h1>人称代名詞 & be動詞マスター</h1>
  <p>I my me mine ／ be動詞（am・are・is）をまとめて覚えよう</p>
</header>
<div id="app"></div>

<script>
/* ===================== データ ===================== */
/* be動詞ドリル用の主語リスト（代名詞＋固有名詞・名詞のかたまり） */
const subjectItems = [
  {subj:"I",    jp:"私は",         be:"am",  conv:null,   note:"amを使うのは I だけ"},
  {subj:"You",  jp:"あなたは",      be:"are", conv:null,   note:"you は単数でも are"},
  {subj:"He",   jp:"彼は",         be:"is",  conv:null,   note:"三人称単数 → is"},
  {subj:"She",  jp:"彼女は",       be:"is",  conv:null,   note:"三人称単数 → is"},
  {subj:"It",   jp:"それは",       be:"is",  conv:null,   note:"三人称単数 → is"},
  {subj:"We",   jp:"私たちは",      be:"are", conv:null,   note:"複数 → are"},
  {subj:"They", jp:"彼らは",       be:"are", conv:null,   note:"複数 → are"},
  {subj:"Taro", jp:"タロウは",      be:"is",  conv:"He",   note:"男の子1人 → He と同じ"},
  {subj:"Hanako", jp:"ハナコは",    be:"is",  conv:"She",  note:"女の子1人 → She と同じ"},
  {subj:"My mother", jp:"私の母は", be:"is",  conv:"She",  note:"女の人1人 → She と同じ"},
  {subj:"Your brother", jp:"あなたのお兄さんは", be:"is", conv:"He", note:"男の人1人 → He と同じ"},
  {subj:"This book", jp:"この本は",  be:"is",  conv:"It",   note:"もの1つ → It と同じ"},
  {subj:"These books", jp:"これらの本は", be:"are", conv:"They", note:"もの2つ以上 → They と同じ"},
  {subj:"You and I", jp:"あなたと私は", be:"are", conv:"We", note:"自分をふくむ2人 → We と同じ"},
  {subj:"Ken and I", jp:"ケンと私は", be:"are", conv:"We", note:"自分をふくむ2人 → We と同じ"},
  {subj:"Taro and Hanako", jp:"タロウとハナコは", be:"are", conv:"They", note:"自分以外の2人 → They と同じ"},
  {subj:"My parents", jp:"私の両親は", be:"are", conv:"They", note:"2人以上 → They と同じ"},
];

/* セットでおぼえるカード（代名詞＋be動詞＋短縮形＋例文） */
const pairCards = [
  {subj:"I",    jp:"私",       be:"am",  sh:"I'm",     ex:"I am a student.",      exJp:"私は生徒です。"},
  {subj:"You",  jp:"あなた",    be:"are", sh:"You're",  ex:"You are kind.",        exJp:"あなたは親切です。"},
  {subj:"He",   jp:"彼",       be:"is",  sh:"He's",    ex:"He is my friend.",     exJp:"彼は私の友だちです。"},
  {subj:"She",  jp:"彼女",     be:"is",  sh:"She's",   ex:"She is a teacher.",    exJp:"彼女は先生です。"},
  {subj:"It",   jp:"それ",     be:"is",  sh:"It's",    ex:"It is a cat.",         exJp:"それはネコです。"},
  {subj:"We",   jp:"私たち",    be:"are", sh:"We're",   ex:"We are happy.",        exJp:"私たちは幸せです。"},
  {subj:"You",  jp:"あなたたち", be:"are", sh:"You're",  ex:"You are good players.",exJp:"あなたたちは良い選手です。"},
  {subj:"They", jp:"彼ら",     be:"are", sh:"They're", ex:"They are my brothers.",exJp:"彼らは私の兄弟です。"},
];

const rows = [
  {num:"単数", person:"一人称",       jp:"私",                    subj:"I",    poss:"my",   obj:"me",   possp:"mine",  be:"am"},
  {num:"単数", person:"二人称",       jp:"あなた",                 subj:"you",  poss:"your", obj:"you",  possp:"yours", be:"are"},
  {num:"単数", person:"三人称（男）", jp:"彼",                    subj:"he",   poss:"his",  obj:"him",  possp:"his",   be:"is"},
  {num:"単数", person:"三人称（女）", jp:"彼女",                   subj:"she",  poss:"her",  obj:"her",  possp:"hers",  be:"is"},
  {num:"単数", person:"三人称（もの）",jp:"それ",                  subj:"it",   poss:"its",  obj:"it",   possp:null,    be:"is"},
  {num:"複数", person:"一人称",       jp:"私たち",                 subj:"we",   poss:"our",  obj:"us",   possp:"ours",  be:"are"},
  {num:"複数", person:"二人称",       jp:"あなたたち",              subj:"you",  poss:"your", obj:"you",  possp:"yours", be:"are"},
  {num:"複数", person:"三人称",       jp:"彼ら／彼女ら／それら",     subj:"they", poss:"their",obj:"them", possp:"theirs",be:"are"},
];

const colDefs = [
  {key:"subj",  label:"〜は・〜が", tag:"主格"},
  {key:"poss",  label:"〜の",       tag:"所有格"},
  {key:"obj",   label:"〜を・〜に", tag:"目的格"},
  {key:"possp", label:"〜のもの",   tag:"所有代名詞"},
];

/* quiz item list（品詞クイズ用） */
let quizItems = [];
rows.forEach((r, ri)=>{
  colDefs.forEach(c=>{
    const val = r[c.key];
    if(!val) return;
    quizItems.push({
      row: r, col: c, en: val,
      jpFull: `${r.num}・${r.person}「${r.jp}」の${c.label}（${c.tag}）`,
      shortJp: `${r.jp}（${c.tag}）`
    });
  });
});

/* ===================== 状態 ===================== */
let state = { screen:"home" };
const STORAGE_KEY = "pronounAppStats_v1";

function loadStats(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { jp2en:{best:0,plays:0}, en2jp:{best:0,plays:0}, pair:{best:0,plays:0}, contract:{best:0,plays:0}, table:{plays:0} };
}
function saveStats(s){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }catch(e){}
}
let stats = loadStats();
if(!stats.contract) stats.contract = {best:0, plays:0};

/* ===================== サウンド ===================== */
let audioCtx = null;
function getCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  return audioCtx;
}
function beep(freq, dur, type){
  const ctx = getCtx();
  if(!ctx) return;
  if(ctx.state === "suspended") ctx.resume();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || "sine";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.15, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + dur);
}
function playCorrect(){ beep(880,0.12,"sine"); setTimeout(()=>beep(1180,0.15,"sine"),90); }
function playWrong(){ beep(220,0.25,"sawtooth"); }

/* ===================== ユーティリティ ===================== */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pickN(arr, n, excludeIdx){
  const pool = arr.map((v,i)=>i).filter(i=>i!==excludeIdx);
  const chosen = shuffle(pool).slice(0,n);
  return chosen.map(i=>arr[i]);
}

const app = document.getElementById("app");
function render(){ app.innerHTML = ""; screens[state.screen](); }

/* ===================== 画面：ホーム ===================== */
const screens = {};

screens.home = function(){
  const totalPlays = (stats.jp2en.plays||0)+(stats.en2jp.plays||0)+(stats.pair.plays||0)+(stats.table.plays||0);
  app.innerHTML = `
    <div class="card">
      <h2 class="section-title">モードをえらぼう</h2>
      <div class="menu-grid">
        <button class="menu-btn btn5" data-go="flash"><span class="emoji">🃏</span>セットでおぼえる</button>
        <button class="menu-btn btn4" data-go="pair"><span class="emoji">🔗</span>be動詞クイズ</button>
        <button class="menu-btn btn1" data-go="table"><span class="emoji">📋</span>表をうめる</button>
        <button class="menu-btn btn6" data-go="contract"><span class="emoji">✂️</span>短縮形クイズ</button>
        <button class="menu-btn btn2" data-go="jp2en"><span class="emoji">🇯🇵→🇬🇧</span>日本語→英語（4択）</button>
        <button class="menu-btn btn3" data-go="en2jp"><span class="emoji">🇬🇧→🇯🇵</span>英語→日本語（4択）</button>
        <button class="menu-btn btn-wide" data-go="grammar"><span class="emoji">📖</span>文法解説を読む</button>
      </div>
    </div>
    <div class="card">
      <h2 class="section-title">きろく</h2>
      <div class="stat-row"><span>be動詞クイズ ベスト</span><span>${stats.pair.best||0} / 10</span></div>
      <div class="stat-row"><span>短縮形クイズ ベスト</span><span>${(stats.contract&&stats.contract.best)||0} / 8</span></div>
      <div class="stat-row"><span>日本語→英語 ベスト</span><span>${stats.jp2en.best||0} / 10</span></div>
      <div class="stat-row"><span>英語→日本語 ベスト</span><span>${stats.en2jp.best||0} / 10</span></div>
      <div class="stat-row"><span>表をうめる 挑戦回数</span><span>${stats.table.plays||0} 回</span></div>
      <div class="stat-row"><span>合計プレイ回数</span><span>${totalPlays} 回</span></div>
    </div>
  `;
  app.querySelectorAll("[data-go]").forEach(b=>{

function startMode(mode){
  if(mode==="table"){ state = {screen:"table"}; render(); return; }
  if(mode==="grammar"){ state = {screen:"grammar"}; render(); return; }
  if(mode==="flash"){ state = {screen:"flash", idx:0, revealed:false, showList:false}; render(); return; }
  if(mode==="jp2en" || mode==="en2jp"){
    const list = shuffle(quizItems).slice(0,10);
    state = {screen:mode, list, idx:0, score:0, answered:false};
    render(); return;
  }
  if(mode==="contract"){
    const list = shuffle(pairCards).slice(0,8);
    state = {screen:"contract", list, idx:0, score:0, answered:false};
    render(); return;
  }
  if(mode==="pair"){
    // 前半は代名詞、後半は固有名詞・名詞のかたまりも混ぜる
    const pronouns = shuffle(subjectItems.filter(s=>!s.conv)).slice(0,6);
    const nouns    = shuffle(subjectItems.filter(s=>s.conv)).slice(0,4);
    const list = shuffle(pronouns.concat(nouns));
    state = {screen:"pair", list, idx:0, score:0, answered:false};
    render(); return;
  }
}

const allCols = [...colDefs, {key:"be", label:"be動詞", tag:"be動詞"}];

let tableAnswers = {};  // key => 正解
let tableBlanks  = {};  // key => 空らんかどうか
let blankOrder   = [];  // 空らんの並び順
let tableFill    = {};  // key => bankId
let wordBank     = [];  // [{id, word, usedBy}]
let activeKey    = null;
let tableGraded  = false;

function buildTableBlanks(){
  tableAnswers = {}; tableBlanks = {}; tableFill = {}; blankOrder = [];
  activeKey = null; tableGraded = false;
  rows.forEach((r, ri)=>{
    allCols.forEach(c=>{
      const val = r[c.key];
      if(!val) return;
      const key = `r${ri}_${c.key}`;
      tableAnswers[key] = val;
      tableBlanks[key] = Math.random() < 0.5;
    });
    // 各行に必ず1つ以上の空らんを作る
    const keysOfRow = Object.keys(tableAnswers).filter(k=>k.indexOf(`r${ri}_`)===0);
    if(!keysOfRow.some(k=>tableBlanks[k])){
      tableBlanks[keysOfRow[Math.floor(Math.random()*keysOfRow.length)]] = true;
    }
  });
  blankOrder = Object.keys(tableBlanks).filter(k=>tableBlanks[k]);
  // 語群＝正解のことば＋まぎらわしいダミー2つ
  const needed = blankOrder.map(k=>tableAnswers[k]);
  const allWords = [...new Set(Object.values(tableAnswers))];
  const dummies = shuffle(allWords).slice(0,2);
  wordBank = shuffle(needed.concat(dummies)).map((w,i)=>({id:i, word:w, usedBy:null}));
  activeKey = blankOrder[0] || null;
}
buildTableBlanks();

/* --- タイマー --- */
const TABLE_TIME = 60;
let tableTimerId = null;
let tableEndAt = 0;

function updateTimerDisplay(sec){
  const num = document.getElementById("timerNum");
  const fill = document.getElementById("timerFill");
  const wrap = document.getElementById("timerWrap");
  if(!num || !fill || !wrap) return;
  const s = Math.max(0, sec);
  num.textContent = s.toFixed(1);
  fill.style.width = (s / TABLE_TIME * 100) + "%";
  if(s <= 15) wrap.classList.add("warn"); else wrap.classList.remove("warn");
}

function startTableTimer(){
  stopTableTimer();
  tableEndAt = Date.now() + TABLE_TIME*1000;
  updateTimerDisplay(TABLE_TIME);
  let lastBeepSec = null;
  tableTimerId = setInterval(()=>{
    const left = (tableEndAt - Date.now())/1000;
    updateTimerDisplay(left);
    const whole = Math.ceil(left);
    if(whole <= 5 && whole >= 1 && whole !== lastBeepSec){
      lastBeepSec = whole;
      beep(660, 0.08, "square");
    }
    if(left <= 0){
      stopTableTimer();
      gradeTable(true);
    }
  }, 100);
}

function stopTableTimer(){
  if(tableTimerId){ clearInterval(tableTimerId); tableTimerId = null; }
}

function gradeTable(timeUp){
  stopTableTimer();
  const total = blankOrder.length;
  let correct = 0;
  blankOrder.forEach(key=>{
    const bankId = tableFill[key];
    if(bankId !== undefined && wordBank[bankId].word === tableAnswers[key]) correct++;
  });
  tableGraded = true;
  activeKey = null;
  drawTable();

  const usedSec = timeUp ? TABLE_TIME : Math.min(TABLE_TIME, TABLE_TIME - Math.max(0,(tableEndAt - Date.now())/1000));
  stats.table.plays = (stats.table.plays||0)+1;
  if(!stats.table.best || correct > stats.table.best){ stats.table.best = correct; }
  saveStats(stats);

  const fb = document.getElementById("tableFeedback");
  fb.className = "feedback " + (correct===total ? "ok":"no");
  let msg = `${correct} / ${total} 問正解！`;
  if(timeUp) msg = "⏰ 時間切れ！ " + msg;
  else msg += `（${usedSec.toFixed(1)}秒）`;
  if(correct===total && !timeUp) msg += " かんぺき！🎉";
  fb.textContent = msg;
  if(correct===total && total>0 && !timeUp){ playCorrect(); } else { playWrong(); }
}

function drawTable(){ renderTableBody(); renderBank(); updateBankTitle(); }

function updateBankTitle(){
  const remain = blankOrder.filter(k=>tableFill[k]===undefined).length;
  const el = document.getElementById("bankTitle");
  if(!el) return;
  el.textContent = tableGraded ? "こたえ合わせ ずみ"
    : (remain>0 ? `ことばをえらぼう（のこり ${remain} こ）` : "ぜんぶ入ったよ！こたえ合わせをしてね");
}

function renderTableBody(){
  const tbody = document.getElementById("tbody");
  if(!tbody) return;
  tbody.innerHTML = "";
  let prevNum = null;
  rows.forEach((r, ri)=>{
    const tr = document.createElement("tr");
    let html = "";
    if(r.num !== prevNum){
      const span = r.num==="単数" ? 5 : 3;
      html += `<td class="num-cell" rowspan="${span}">${r.num}</td>`;
      prevNum = r.num;
    }
    html += `<td>${r.person}</td>`;
    html += `<td class="label-cell">${r.jp}</td>`;
    allCols.forEach(c=>{
      const key = `r${ri}_${c.key}`;
      const val = r[c.key];
      if(!val){
        html += `<td style="font-size:0.6rem;color:#999;">（ほぼ<br>使わない）</td>`;
      } else if(tableBlanks[key]){
        const bankId = tableFill[key];
        const filled = bankId !== undefined;
        const word = filled ? wordBank[bankId].word : "？";
        let cls = "cell-btn";
        if(filled) cls += " filled";
        if(!tableGraded && activeKey === key) cls += " active";
        let extra = "";
        if(tableGraded){
          const ok = filled && wordBank[bankId].word === tableAnswers[key];
          cls += ok ? " ok" : " ng";
          if(!ok) extra = `<span class="answer-shown">正解: ${tableAnswers[key]}</span>`;
        }
        html += `<td><button class="${cls}" data-key="${key}">${word}</button>${extra}</td>`;
      } else {
        html += `<td>${val}</td>`;
      }
    });
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll(".cell-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(tableGraded) return;
      const key = btn.dataset.key;
      const bankId = tableFill[key];
      if(bankId !== undefined){
        wordBank[bankId].usedBy = null;
        delete tableFill[key];
      }
      activeKey = key;
      drawTable();
    });
  });
}

function renderBank(){
  const el = document.getElementById("bank");
  if(!el) return;
  el.innerHTML = wordBank.map(b=>
    `<button class="bank-btn ${b.usedBy!==null?"used":""}" data-id="${b.id}">${b.word}</button>`
  ).join("");
  el.querySelectorAll(".bank-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(tableGraded) return;
      const item = wordBank[Number(btn.dataset.id)];
      if(item.usedBy !== null){
        // もう使っている語 → 取り消す
        delete tableFill[item.usedBy];
        item.usedBy = null;
        drawTable();
        return;
      }
      let target = activeKey;
      if(!target || tableFill[target] !== undefined){
        target = blankOrder.find(k=>tableFill[k]===undefined);
      }
      if(!target) return;
      tableFill[target] = item.id;
      item.usedBy = target;
      // 次の空らんへ自動で進む
      activeKey = blankOrder.find(k=>tableFill[k]===undefined) || null;
      beep(720,0.06,"triangle");
      drawTable();
    });
  });
}

function renderChoiceQuiz(mode){
  const s = state;
  const item = s.list[s.idx];
  const isJp2en = mode==="jp2en";
  const correctText = isJp2en ? item.en : item.shortJp;
  const others = pickN(quizItems, 20, quizItems.indexOf(item))
    .map(o => isJp2en ? o.en : o.shortJp)
    .filter(v => v !== correctText);
  const uniqueOthers = [...new Set(others)].slice(0,3);
  while(uniqueOthers.length<3){ uniqueOthers.push(correctText+"・"); } // fallback safety
  const choices = shuffle([correctText, ...uniqueOthers]);

  app.innerHTML = `
    <button class="back-btn" id="backBtn">← もどる</button>
    <div class="card">
      <div class="progress-bar"><div class="progress-fill" style="width:${(s.idx/s.list.length)*100}%"></div></div>
      <div class="question-box">
        <span class="question-tag">${s.idx+1} / ${s.list.length} 問目　スコア：${s.score}</span>
        <div class="question-jp">${ isJp2en ? item.jpFull : item.en }</div>
        <div style="font-size:0.8rem;color:#777;">${ isJp2en ? "この意味の英語はどれ？" : "この英語の意味はどれ？" }</div>
      </div>
      <div class="choice-grid" id="choiceGrid">
        ${choices.map(c=>`<button class="choice-btn" data-val="${c}">${c}</button>`).join("")}
      </div>
      <div class="feedback" id="quizFeedback"></div>
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", goHome);
  const grid = document.getElementById("choiceGrid");
  grid.querySelectorAll(".choice-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(s.answered) return;
      s.answered = true;
      const val = btn.dataset.val;
      const ok = val === correctText;
      grid.querySelectorAll(".choice-btn").forEach(b=>{
        b.classList.add("disabled");
        if(b.dataset.val===correctText) b.classList.add("correct");
        if(b===btn && !ok) b.classList.add("wrong");
      });
      const fb = document.getElementById("quizFeedback");
      if(ok){
        s.score++; playCorrect();
        fb.className="feedback ok"; fb.textContent="せいかい！🎉";
      } else {
        playWrong();
        fb.className="feedback no"; fb.textContent=`ざんねん…正解は「${correctText}」`;
      }
      setTimeout(()=>{
        s.idx++;
        if(s.idx >= s.list.length){ finishQuiz(mode); }
        else { render(); }
      }, 900);
    });
  });
}

function finishQuiz(mode){
  const s = state;
  if(mode==="jp2en"){ stats.jp2en.plays=(stats.jp2en.plays||0)+1; stats.jp2en.best=Math.max(stats.jp2en.best||0, s.score); }
  if(mode==="en2jp"){ stats.en2jp.plays=(stats.en2jp.plays||0)+1; stats.en2jp.best=Math.max(stats.en2jp.best||0, s.score); }
  if(mode==="pair"){ stats.pair.plays=(stats.pair.plays||0)+1; stats.pair.best=Math.max(stats.pair.best||0, s.score); }
  if(mode==="contract"){ stats.contract.plays=(stats.contract.plays||0)+1; stats.contract.best=Math.max(stats.contract.best||0, s.score); }
  saveStats(stats);
  state = {screen:"result", mode, score:s.score, total:s.list.length};
  render();
}

      if(s.answered) return;
      s.answered = true;
      const ok = btn.dataset.val === correct;
      grid.querySelectorAll(".choice-btn").forEach(b=>{
        b.classList.add("disabled");
        if(b.dataset.val===correct) b.classList.add("correct");
        if(b===btn && !ok) b.classList.add("wrong");
      });
      const fb = document.getElementById("quizFeedback");
      if(ok){ s.score++; playCorrect(); fb.className="feedback ok"; fb.textContent="せいかい！🎉"; }
      else { playWrong(); fb.className="feedback no"; fb.textContent=`正解は「${correct}」`; }
      setTimeout(()=>{
        s.idx++; s.answered=false;
        if(s.idx >= s.list.length){ finishQuiz("contract"); }
        else { render(); }
      }, 900);
    });
  });
};
